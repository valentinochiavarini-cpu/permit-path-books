<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" font-family="Inter, Arial, sans-serif">
  <!-- Single sign for a picture question: detour ahead (no label; the question names shape and color in words) -->
  <g transform="translate(50,50) scale(1.324) translate(-0,-0)"><polygon points="0,-34 34,0 0,34 -34,0" fill="#F47920" stroke="#1c1c1c" stroke-width="1" stroke-linejoin="round"/><polygon points="0,-30 30,0 0,30 -30,0" fill="none" stroke="#1c1c1c" stroke-width="2.2" stroke-linejoin="round"/><text x="0" y="-1.6" font-size="7.8" font-weight="800" fill="#1c1c1c" text-anchor="middle">DETOUR</text><text x="0" y="7.2" font-size="7.8" font-weight="800" fill="#1c1c1c" text-anchor="middle">AHEAD</text></g>
</svg>
