<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 236" font-family="Inter, Arial, sans-serif">
  <!-- Warning signs for intersections, controls ahead, surface and clearance -->
  <style>
    .lbl { font-size: 11px; font-weight: 600; fill: #1c1c1c; text-anchor: middle; }
    .sub { font-size: 9.5px; font-weight: 500; fill: #555; text-anchor: middle; }
  </style>
  <!-- Crossroad -->
  <g transform="translate(57.5,46)">
    <polygon points="0,-34 34,0 0,34 -34,0" fill="#FFCD00" stroke="#1c1c1c" stroke-width="1" stroke-linejoin="round"/>
    <polygon points="0,-30 30,0 0,30 -30,0" fill="none" stroke="#1c1c1c" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M0,-22 L0,22 M-22,0 L22,0" fill="none" stroke="#1c1c1c" stroke-width="5"/>
  </g>
  <text class="lbl" x="57.5" y="100">Crossroad</text>
  <text class="sub" x="57.5" y="113">Yellow diamond</text>
  <!-- T intersection -->
  <g transform="translate(172.5,46)">
    <polygon points="0,-34 34,0 0,34 -34,0" fill="#FFCD00" stroke="#1c1c1c" stroke-width="1" stroke-linejoin="round"/>
    <polygon points="0,-30 30,0 0,30 -30,0" fill="none" stroke="#1c1c1c" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M-20,-8 L20,-8 M0,-8 L0,22" fill="none" stroke="#1c1c1c" stroke-width="5"/>
  </g>
  <text class="lbl" x="172.5" y="100">T Intersection</text>
  <text class="sub" x="172.5" y="113">Your road ends: turn</text>
  <!-- Y intersection -->
  <g transform="translate(287.5,46)">
    <polygon points="0,-34 34,0 0,34 -34,0" fill="#FFCD00" stroke="#1c1c1c" stroke-width="1" stroke-linejoin="round"/>
    <polygon points="0,-30 30,0 0,30 -30,0" fill="none" stroke="#1c1c1c" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M0,22 L0,2 L-13,-14 M0,2 L13,-14" fill="none" stroke="#1c1c1c" stroke-width="5"/>
  </g>
  <text class="lbl" x="287.5" y="100">Y Intersection</text>
  <text class="sub" x="287.5" y="113">The road splits</text>
  <!-- Side road -->
  <g transform="translate(402.5,46)">
    <polygon points="0,-34 34,0 0,34 -34,0" fill="#FFCD00" stroke="#1c1c1c" stroke-width="1" stroke-linejoin="round"/>
    <polygon points="0,-30 30,0 0,30 -30,0" fill="none" stroke="#1c1c1c" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M-5,-22 L-5,22 M-5,0 L16,0" fill="none" stroke="#1c1c1c" stroke-width="5"/>
  </g>
  <text class="lbl" x="402.5" y="100">Side Road</text>
  <text class="sub" x="402.5" y="113">Road joins from one side</text>
  <!-- Stop ahead -->
  <g transform="translate(57.5,166)">
    <polygon points="0,-34 34,0 0,34 -34,0" fill="#FFCD00" stroke="#1c1c1c" stroke-width="1" stroke-linejoin="round"/>
    <polygon points="0,-30 30,0 0,30 -30,0" fill="none" stroke="#1c1c1c" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M0,22 L0,13" fill="none" stroke="#1c1c1c" stroke-width="4.5"/>
    <polygon points="0.0,6.0 4.5,12.6 -4.5,12.6" fill="#1c1c1c"/>
    <g transform="translate(0,-6)">
    <polygon points="-5.4,-13.0 5.4,-13.0 13.0,-5.4 13.0,5.4 5.4,13.0 -5.4,13.0 -13.0,5.4 -13.0,-5.4" fill="#fff" stroke="#1c1c1c" stroke-width="1"/>
    <polygon points="-5.0,-12.0 5.0,-12.0 12.0,-5.0 12.0,5.0 5.0,12.0 -5.0,12.0 -12.0,5.0 -12.0,-5.0" fill="#C8102E"/>
    </g>
  </g>
  <text class="lbl" x="57.5" y="216">Stop Ahead</text>
  <text class="sub" x="57.5" y="229">Red octagon on yellow</text>
  <!-- Signal ahead -->
  <g transform="translate(172.5,166)">
    <polygon points="0,-34 34,0 0,34 -34,0" fill="#FFCD00" stroke="#1c1c1c" stroke-width="1" stroke-linejoin="round"/>
    <polygon points="0,-30 30,0 0,30 -30,0" fill="none" stroke="#1c1c1c" stroke-width="2.2" stroke-linejoin="round"/>
    <rect x="-8" y="-21" width="16" height="40" rx="3" fill="#1c1c1c"/>
    <circle cy="-12" r="4.6" fill="#C8102E"/>
    <circle cy="0" r="4.6" fill="#FFCD00" stroke="#fff" stroke-width="0.8"/>
    <circle cy="12" r="4.6" fill="#006B3F"/>
  </g>
  <text class="lbl" x="172.5" y="216">Signal Ahead</text>
  <text class="sub" x="172.5" y="229">Traffic light on yellow</text>
  <!-- Slippery when wet -->
  <g transform="translate(287.5,166)">
    <polygon points="0,-34 34,0 0,34 -34,0" fill="#FFCD00" stroke="#1c1c1c" stroke-width="1" stroke-linejoin="round"/>
    <polygon points="0,-30 30,0 0,30 -30,0" fill="none" stroke="#1c1c1c" stroke-width="2.2" stroke-linejoin="round"/>
    <rect x="-11.55" y="-14.3" width="23.1" height="10.5" rx="3.1500000000000004" fill="#1c1c1c"/>
    <path d="M-7.3500000000000005,-14.3 L-4.2,-20.6 L4.2,-20.6 L7.3500000000000005,-14.3 Z" fill="#1c1c1c"/>
    <rect x="-10.5" y="-4.85" width="5.25" height="4.2" fill="#1c1c1c"/>
    <rect x="5.25" y="-4.85" width="5.25" height="4.2" fill="#1c1c1c"/>
    <path d="M-6,0 C-12,6 -1,11 -7,18" fill="none" stroke="#1c1c1c" stroke-width="2.4"/>
    <path d="M6,0 C0,6 11,11 5,18" fill="none" stroke="#1c1c1c" stroke-width="2.4"/>
  </g>
  <text class="lbl" x="287.5" y="216">Slippery When Wet</text>
  <text class="sub" x="287.5" y="229">Car with wavy skid marks</text>
  <!-- Low clearance -->
  <g transform="translate(402.5,166)">
    <polygon points="0,-34 34,0 0,34 -34,0" fill="#FFCD00" stroke="#1c1c1c" stroke-width="1" stroke-linejoin="round"/>
    <polygon points="0,-30 30,0 0,30 -30,0" fill="none" stroke="#1c1c1c" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M0,-22 L0,-15" fill="none" stroke="#1c1c1c" stroke-width="3"/>
    <polygon points="0.0,-22.0 3.8,-16.5 -3.8,-16.5" fill="#1c1c1c"/>
    <text x="0" y="4" font-size="10" font-weight="800" fill="#1c1c1c" text-anchor="middle">12 FT</text>
    <text x="0" y="14" font-size="10" font-weight="800" fill="#1c1c1c" text-anchor="middle">6 IN</text>
    <path d="M0,17 L0,22" fill="none" stroke="#1c1c1c" stroke-width="3"/>
    <polygon points="0.0,24.0 -3.8,18.5 3.8,18.5" fill="#1c1c1c"/>
  </g>
  <text class="lbl" x="402.5" y="216">Low Clearance</text>
  <text class="sub" x="402.5" y="229">Bridge lower than normal</text>
</svg>
