<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 258" font-family="Inter, Arial, sans-serif">
  <!-- Approach to a railroad crossing, top-down: W10-1 advance warning sign, RXR marking (8C.02), stop line no closer than 15 ft from the nearest rail (8C.03), crossbuck R15-1 (8B.03), flashing light signals (8D.02), gate (8D.03) -->
