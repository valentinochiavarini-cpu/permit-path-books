  <circle cx="365.5" cy="208" r="6" fill="none" stroke="#fff" stroke-width="1"/>
  <circle cx="393.5" cy="208" r="6" fill="#C8102E" stroke="#1c1c1c" stroke-width="1"/>
  <circle cx="393.5" cy="208" r="6" fill="none" stroke="#fff" stroke-width="1"/>
  <line x1="355.5" y1="208" x2="350.5" y2="208" stroke="#1c1c1c" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="403.5" y1="208" x2="408.5" y2="208" stroke="#1c1c1c" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="336" cy="180" r="7.5" fill="#1c1c1c"/><text x="336" y="183.6" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">4</text>
  <text class="railroad_crossing_lbl" x="380" y="232">Crossbuck and gate</text>
  <text class="railroad_crossing_sub" x="380" y="244.5">White X, flashing red lights,</text>
  <text class="railroad_crossing_sub" x="380" y="257.0">red and white gate arm</text>
