  <g transform="translate(379.5,180)"><g transform="rotate(35)"><rect x="-25" y="-4.5" width="50" height="9" fill="#fff" stroke="#1c1c1c" stroke-width="1.2"/></g><g transform="rotate(-35)"><rect x="-25" y="-4.5" width="50" height="9" fill="#fff" stroke="#1c1c1c" stroke-width="1.2"/></g></g>
