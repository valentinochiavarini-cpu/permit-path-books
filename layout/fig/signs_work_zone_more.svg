<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 240" font-family="Inter, Arial, sans-serif">
  <!-- More work zone signs: orange diamonds and orange rectangles with black letters or symbols -->
  <style>
    .lbl { font-size: 11px; font-weight: 600; fill: #1c1c1c; text-anchor: middle; }
    .sub { font-size: 9.5px; font-weight: 500; fill: #555; text-anchor: middle; }
  </style>
  <!-- Flagger Ahead -->
  <g transform="translate(76.7,38) scale(0.820) translate(-0,-0)"><polygon points="0,-34 34,0 0,34 -34,0" fill="#F47920" stroke="#1c1c1c" stroke-width="1" stroke-linejoin="round"/><polygon points="0,-30 30,0 0,30 -30,0" fill="none" stroke="#1c1c1c" stroke-width="2.2" stroke-linejoin="round"/><circle cx="-5" cy="-15" r="4" fill="#1c1c1c"/><path d="M-5,-10 L-5,5" stroke="#1c1c1c" stroke-width="6"/><path d="M-5,4 L-9,21 M-5,4 L-1,21" stroke="#1c1c1c" stroke-width="4"/><path d="M-5,-7 L-12,4" stroke="#1c1c1c" stroke-width="3"/><path d="M-4,-7 L7,-4" stroke="#1c1c1c" stroke-width="3"/><path d="M8,-3 L8,14" stroke="#1c1c1c" stroke-width="1.8"/><path d="M8,-10 L8,-3" stroke="#1c1c1c" stroke-width="1.8"/><polygon points="5.5,-19 10.5,-19 14,-15.5 14,-10.5 10.5,-7 5.5,-7 2,-10.5 2,-15.5" fill="#1c1c1c"/></g>
  <text class="lbl" x="76.7" y="86">Flagger Ahead</text>
  <text class="sub" x="76.7" y="99">Orange diamond</text>
  <text class="sub" x="76.7" y="111">Be ready to stop</text>
  <!-- Workers -->
  <g transform="translate(230,38) scale(0.820) translate(-0,-0)"><polygon points="0,-34 34,0 0,34 -34,0" fill="#F47920" stroke="#1c1c1c" stroke-width="1" stroke-linejoin="round"/><polygon points="0,-30 30,0 0,30 -30,0" fill="none" stroke="#1c1c1c" stroke-width="2.2" stroke-linejoin="round"/><circle cx="-7" cy="-15" r="4" fill="#1c1c1c"/><path d="M-6,-10 L1,3" stroke="#1c1c1c" stroke-width="6" stroke-linecap="round"/><path d="M1,3 L-4,20 M1,3 L7,20" stroke="#1c1c1c" stroke-width="4"/><path d="M-4,-6 L-12,4 M-3,-5 L-8,6" stroke="#1c1c1c" stroke-width="2.6"/><path d="M-15,-3 L-6,15" stroke="#1c1c1c" stroke-width="2"/><polygon points="-8,13 -3,12 -2,20 -7,19" fill="#1c1c1c"/></g>
  <text class="lbl" x="230" y="86">Workers</text>
  <text class="sub" x="230" y="99">Orange diamond</text>
  <text class="sub" x="230" y="111">People in the road</text>
  <!-- Lane Closed Ahead -->
  <g transform="translate(383.3,38) scale(0.820) translate(-0,-0)"><polygon points="0,-34 34,0 0,34 -34,0" fill="#F47920" stroke="#1c1c1c" stroke-width="1" stroke-linejoin="round"/><polygon points="0,-30 30,0 0,30 -30,0" fill="none" stroke="#1c1c1c" stroke-width="2.2" stroke-linejoin="round"/><text x="0" y="-9.8" font-size="7.4" font-weight="800" fill="#1c1c1c" text-anchor="middle">RIGHT</text><text x="0" y="-1.5" font-size="7.4" font-weight="800" fill="#1c1c1c" text-anchor="middle">LANE</text><text x="0" y="6.8" font-size="7.4" font-weight="800" fill="#1c1c1c" text-anchor="middle">CLOSED</text><text x="0" y="15.1" font-size="7.4" font-weight="800" fill="#1c1c1c" text-anchor="middle">AHEAD</text></g>
  <text class="lbl" x="383.3" y="86">Lane Closed Ahead</text>
  <text class="sub" x="383.3" y="99">Orange diamond</text>
  <text class="sub" x="383.3" y="111">Merge early</text>
  <!-- Detour Ahead -->
  <g transform="translate(76.7,160) scale(0.820) translate(-0,-0)"><polygon points="0,-34 34,0 0,34 -34,0" fill="#F47920" stroke="#1c1c1c" stroke-width="1" stroke-linejoin="round"/><polygon points="0,-30 30,0 0,30 -30,0" fill="none" stroke="#1c1c1c" stroke-width="2.2" stroke-linejoin="round"/><text x="0" y="-1.6" font-size="7.8" font-weight="800" fill="#1c1c1c" text-anchor="middle">DETOUR</text><text x="0" y="7.2" font-size="7.8" font-weight="800" fill="#1c1c1c" text-anchor="middle">AHEAD</text></g>
  <text class="lbl" x="76.7" y="208">Detour Ahead</text>
  <text class="sub" x="76.7" y="221">Orange diamond</text>
  <text class="sub" x="76.7" y="233">Route changes ahead</text>
  <!-- Detour -->
  <g transform="translate(230,160) scale(0.820) translate(-0,-0)"><rect x="-38" y="-21" width="76" height="42" rx="3" fill="#F47920" stroke="#1c1c1c" stroke-width="1"/><rect x="-35.5" y="-18.5" width="71" height="37" rx="1.5" fill="none" stroke="#1c1c1c" stroke-width="1.8"/><text x="0" y="-3" font-size="12" font-weight="800" fill="#1c1c1c" text-anchor="middle">DETOUR</text><polygon points="-20,7 8,7 8,2.5 22,10.5 8,18.5 8,14 -20,14" fill="#1c1c1c"/></g>
  <text class="lbl" x="230" y="208">Detour</text>
  <text class="sub" x="230" y="221">Orange rectangle</text>
  <text class="sub" x="230" y="233">Follow the arrow</text>
  <!-- End Road Work -->
  <g transform="translate(383.3,160) scale(0.820) translate(-0,-0)"><rect x="-40" y="-18" width="80" height="36" rx="3" fill="#F47920" stroke="#1c1c1c" stroke-width="1"/><rect x="-37.5" y="-15.5" width="75" height="31" rx="1.5" fill="none" stroke="#1c1c1c" stroke-width="1.8"/><text x="0" y="-3" font-size="11" font-weight="800" fill="#1c1c1c" text-anchor="middle">END</text><text x="0" y="9.3" font-size="11" font-weight="800" fill="#1c1c1c" text-anchor="middle">ROAD WORK</text></g>
  <text class="lbl" x="383.3" y="208">End Road Work</text>
  <text class="sub" x="383.3" y="221">Orange rectangle</text>
  <text class="sub" x="383.3" y="233">Work zone ends</text>
</svg>
