<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 210" font-family="Inter, Arial, sans-serif">
  <!-- Permit Path figure: counting following distance with a fixed point. No number of seconds is shown: the state box gives the count. -->
  <style>
    .fc_lbl { font-size: 11px; font-weight: 600; fill: #1c1c1c; text-anchor: start; }
    .fc_sub { font-size: 9.5px; font-weight: 500; fill: #555; text-anchor: start; }
    .fc_num { font-size: 10px; font-weight: 700; fill: #fff; text-anchor: middle; }
  </style>
  <defs>
    <marker id="ah_fc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c1c1c"/></marker>
    <g id="fc_road">
      <rect x="0" y="0" width="460" height="44" fill="#d9d9d9"/>
      <line x1="0" y1="2" x2="460" y2="2" stroke="#888" stroke-width="3.5"/><line x1="0" y1="2" x2="460" y2="2" stroke="#fff" stroke-width="2"/>
      <line x1="0" y1="42" x2="460" y2="42" stroke="#888" stroke-width="3.5"/><line x1="0" y1="42" x2="460" y2="42" stroke="#fff" stroke-width="2"/>
      <!-- fixed point: a sign post beside the road -->
      <line x1="300" y1="0" x2="300" y2="50" stroke="#1c1c1c" stroke-width="1.2" stroke-dasharray="3 3"/>
      <rect x="294" y="50" width="12" height="12" fill="#fff" stroke="#1c1c1c" stroke-width="1.5"/>
    </g>
    <!-- cars drawn heading right: windshield band toward the right end -->
    <g id="fc_truck"><rect x="-26" y="-10" width="52" height="20" rx="3" fill="#f2f2f2" stroke="#1c1c1c" stroke-width="1"/><rect x="14" y="-8" width="5" height="16" fill="#1c1c1c"/></g>
    <g id="fc_you"><rect x="-17" y="-9" width="34" height="18" rx="3" fill="#3a6db5" stroke="#1c1c1c" stroke-width="1"/><rect x="5" y="-7" width="5" height="14" fill="#1c1c1c"/></g>
  </defs>

  <!-- step 1: rear of the car ahead passes the fixed point, start counting -->
  <g transform="translate(0,34)">
    <use href="#fc_road"/>
    <use href="#fc_truck" x="326" y="22"/>
    <use href="#fc_you" x="150" y="22"/>
    <text x="146" y="26" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">You</text>
  </g>
  <circle cx="10" cy="14" r="8" fill="#1c1c1c"/><text class="fc_num" x="10" y="18">1</text>
  <text class="fc_lbl" x="24" y="13">The back of the car ahead passes a fixed point.</text>
  <text class="fc_sub" x="24" y="25">Start counting: one thousand one, one thousand two...</text>
  <text class="fc_sub" x="312" y="105">Fixed point (a sign)</text>

  <!-- step 2: front of your car reaches the same point, stop counting -->
  <g transform="translate(0,140)">
    <use href="#fc_road"/>
    <use href="#fc_truck" x="440" y="22"/>
    <use href="#fc_you" x="283" y="22"/>
    <text x="279" y="26" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">You</text>
  </g>
  <circle cx="10" cy="120" r="8" fill="#1c1c1c"/><text class="fc_num" x="10" y="124">2</text>
  <text class="fc_lbl" x="24" y="119">Your front bumper reaches the same point. Stop counting.</text>
  <text class="fc_sub" x="24" y="131">Reached it before your state's count? You are too close. Ease off the gas.</text>
</svg>
