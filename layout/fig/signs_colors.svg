<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 242" font-family="Inter, Arial, sans-serif">
  <!-- Sign color chart: one small example per MUTCD sign color, with the color named in the label and its meaning below -->
  <style>
    .signs_colors_lbl { font-size: 11px; font-weight: 600; fill: #1c1c1c; text-anchor: middle; }
    .signs_colors_sub { font-size: 9.5px; font-weight: 500; fill: #555; text-anchor: middle; }
  </style>
  <!-- Red -->
  <g transform="translate(46,34)"><polygon points="-10.8,-26 10.8,-26 26,-10.8 26,10.8 10.8,26 -10.8,26 -26,10.8 -26,-10.8" fill="#fff" stroke="#1c1c1c" stroke-width="1"/><polygon points="-9.9,-23.9 9.9,-23.9 23.9,-9.9 23.9,9.9 9.9,23.9 -9.9,23.9 -23.9,9.9 -23.9,-9.9" fill="#C8102E"/><text x="0" y="5" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">STOP</text></g>
  <text class="signs_colors_lbl" x="46" y="86">Red</text>
  <text class="signs_colors_sub" x="46" y="99">Stop, yield,</text>
  <text class="signs_colors_sub" x="46" y="111">not allowed</text>
  <!-- White -->
  <g transform="translate(138,34)"><rect x="-19.0" y="-26.0" width="38" height="52" rx="4" fill="#fff" stroke="#1c1c1c" stroke-width="1"/><rect x="-16.0" y="-23.0" width="32" height="46" rx="2" fill="none" stroke="#1c1c1c" stroke-width="2"/><text x="0" y="-11" font-size="8.6" font-weight="800" fill="#1c1c1c" text-anchor="middle">SPEED</text><text x="0" y="-1" font-size="8.6" font-weight="800" fill="#1c1c1c" text-anchor="middle">LIMIT</text><text x="0" y="20" font-size="19" font-weight="800" fill="#1c1c1c" text-anchor="middle">35</text></g>
  <text class="signs_colors_lbl" x="138" y="86">White</text>
  <text class="signs_colors_sub" x="138" y="99">Rules</text>
  <text class="signs_colors_sub" x="138" y="111">(regulatory)</text>
  <!-- Yellow -->
  <g transform="translate(230,34)"><g transform="scale(0.78)"><polygon points="0,-34 34,0 0,34 -34,0" fill="#FFCD00" stroke="#1c1c1c" stroke-width="1" stroke-linejoin="round"/><polygon points="0,-30 30,0 0,30 -30,0" fill="none" stroke="#1c1c1c" stroke-width="2.2" stroke-linejoin="round"/><path d="M-6,22 L-6,2 C-6,-8 -1,-12 6,-14" fill="none" stroke="#1c1c1c" stroke-width="4.5"/><polygon points="13.0,-16.5 6.5,-8.2 2.6,-18.7" fill="#1c1c1c"/></g></g>
  <text class="signs_colors_lbl" x="230" y="86">Yellow</text>
  <text class="signs_colors_sub" x="230" y="99">General</text>
  <text class="signs_colors_sub" x="230" y="111">warning</text>
  <!-- Yellow-green -->
  <g transform="translate(322,34)"><g transform="scale(0.78)"><polygon points="0,-34 34,0 0,34 -34,0" fill="#C6D52B" stroke="#1c1c1c" stroke-width="1" stroke-linejoin="round"/><polygon points="0,-30 30,0 0,30 -30,0" fill="none" stroke="#1c1c1c" stroke-width="2.2" stroke-linejoin="round"/><circle cx="-2" cy="-17" r="4.2" fill="#1c1c1c"/><path d="M-1,-11 L1,4" stroke="#1c1c1c" stroke-width="6" stroke-linecap="round" fill="none"/><path d="M1,3 L-7,19 M1,3 L8,19" stroke="#1c1c1c" stroke-width="4.2" stroke-linecap="round" fill="none"/><path d="M-1,-8 L-9,1 M-1,-8 L7,-1" stroke="#1c1c1c" stroke-width="3.4" stroke-linecap="round" fill="none"/></g></g>
  <text class="signs_colors_lbl" x="322" y="86">Yellow-green</text>
  <text class="signs_colors_sub" x="322" y="99">Fluorescent: school,</text>
  <text class="signs_colors_sub" x="322" y="111">walkers, bikes</text>
  <!-- Orange -->
  <g transform="translate(414,34)"><g transform="scale(0.78)"><polygon points="0,-34 34,0 0,34 -34,0" fill="#F47920" stroke="#1c1c1c" stroke-width="1" stroke-linejoin="round"/><polygon points="0,-30 30,0 0,30 -30,0" fill="none" stroke="#1c1c1c" stroke-width="2.2" stroke-linejoin="round"/></g><text x="0" y="-2" font-size="9.5" font-weight="800" fill="#1c1c1c" text-anchor="middle">ROAD</text><text x="0" y="9" font-size="9.5" font-weight="800" fill="#1c1c1c" text-anchor="middle">WORK</text></g>
  <text class="signs_colors_lbl" x="414" y="86">Orange</text>
  <text class="signs_colors_sub" x="414" y="99">Work zone</text>
  <!-- Green -->
  <g transform="translate(46,155)"><rect x="-38.0" y="-21.0" width="76" height="42" rx="4" fill="#006B3F" stroke="#1c1c1c" stroke-width="1"/><rect x="-35.0" y="-18.0" width="70" height="36" rx="2" fill="none" stroke="#fff" stroke-width="2"/><text x="0" y="-3" font-size="11" font-weight="800" fill="#fff" text-anchor="middle">Oak Valley</text><text x="0" y="12" font-size="10" font-weight="800" fill="#fff" text-anchor="middle">1 MILE</text></g>
  <text class="signs_colors_lbl" x="46" y="207">Green</text>
  <text class="signs_colors_sub" x="46" y="220">Direction, guide</text>
  <!-- Blue -->
  <g transform="translate(138,155)"><rect x="-21.0" y="-21.0" width="42" height="42" rx="4" fill="#003F87" stroke="#1c1c1c" stroke-width="1"/><rect x="-18.0" y="-18.0" width="36" height="36" rx="2" fill="none" stroke="#fff" stroke-width="2"/><text x="0" y="9" font-size="26" font-weight="800" fill="#fff" text-anchor="middle">H</text></g>
  <text class="signs_colors_lbl" x="138" y="207">Blue</text>
  <text class="signs_colors_sub" x="138" y="220">Motorist</text>
  <text class="signs_colors_sub" x="138" y="232">services</text>
  <!-- Brown -->
  <g transform="translate(230,155)"><rect x="-21.0" y="-21.0" width="42" height="42" rx="4" fill="#6B4423" stroke="#1c1c1c" stroke-width="1"/><rect x="-18.0" y="-18.0" width="36" height="36" rx="2" fill="none" stroke="#fff" stroke-width="2"/><polygon points="0,-13 15,11 -15,11" fill="#fff"/><polygon points="0,-1 6,11 -6,11" fill="#6B4423"/></g>
  <text class="signs_colors_lbl" x="230" y="207">Brown</text>
  <text class="signs_colors_sub" x="230" y="220">Recreation,</text>
  <text class="signs_colors_sub" x="230" y="232">parks</text>
  <!-- Fluorescent pink -->
  <g transform="translate(322,155)"><g transform="scale(0.88)"><polygon points="0,-34 34,0 0,34 -34,0" fill="#E8418C" stroke="#1c1c1c" stroke-width="1" stroke-linejoin="round"/><polygon points="0,-30 30,0 0,30 -30,0" fill="none" stroke="#1c1c1c" stroke-width="2.2" stroke-linejoin="round"/></g><text x="0" y="-0.5" font-size="7" font-weight="800" fill="#1c1c1c" text-anchor="middle">INCIDENT</text><text x="0" y="8.5" font-size="7" font-weight="800" fill="#1c1c1c" text-anchor="middle">AHEAD</text></g>
  <text class="signs_colors_lbl" x="322" y="207">Fluorescent pink</text>
  <text class="signs_colors_sub" x="322" y="220">Incident ahead</text>
  <!-- Black -->
  <g transform="translate(414,155)"><rect x="-36" y="-14" width="72" height="28" rx="3" fill="#1c1c1c"/><polygon points="-31,-5 13,-5 13,-10 31,0 13,10 13,5 -31,5" fill="#fff"/><text x="-6" y="3.3" font-size="9" font-weight="800" fill="#1c1c1c" text-anchor="middle">ONE WAY</text></g>
  <text class="signs_colors_lbl" x="414" y="207">Black</text>
  <text class="signs_colors_sub" x="414" y="220">One Way signs</text>
</svg>
