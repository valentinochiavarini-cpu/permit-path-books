<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 250" font-family="Inter, Arial, sans-serif">
  <!-- Permit Path figure: what the mirrors show and the blind spots behind each shoulder. Top-down, your car heads up the page. -->
  <style>
    .bs_lbl { font-size: 11px; font-weight: 600; fill: #1c1c1c; text-anchor: start; }
    .bs_sub { font-size: 9.5px; font-weight: 500; fill: #555; text-anchor: start; }
  </style>
  <defs>
    <pattern id="bs_hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="7" height="7" fill="#F47920"/><line x1="0" y1="0" x2="0" y2="7" stroke="#1c1c1c" stroke-width="1.2"/>
    </pattern>
  </defs>

  <!-- three lanes -->
  <rect x="60" y="0" width="216" height="250" fill="#d9d9d9"/>
  <g stroke="#888" stroke-width="3.5" stroke-dasharray="14 10"><path d="M132,0 V250 M204,0 V250"/></g>
  <g stroke="#fff" stroke-width="2" stroke-dasharray="14 10"><path d="M132,0 V250 M204,0 V250"/></g>

  <!-- mirror views (light blue): inside mirror straight back, side mirrors back along each side -->
  <g fill="#9ec3e6" fill-opacity="0.75" stroke="#003F87" stroke-width="1">
    <polygon points="160,140 176,140 194,250 142,250"/>
    <polygon points="149,92 96,250 135,250 148,140"/>
    <polygon points="187,92 240,250 201,250 188,140"/>
  </g>

  <!-- blind spots (orange striped) beside and behind each shoulder -->
  <g fill="url(#bs_hatch)" stroke="#1c1c1c" stroke-width="1">
    <polygon points="70,112 128,112 128,185 108,185 92,175 70,150"/>
    <polygon points="266,112 208,112 208,185 228,185 244,175 266,150"/>
  </g>

  <!-- your car, heading up -->
  <g transform="translate(168,115)">
    <rect x="-19" y="-36" width="38" height="72" rx="7" fill="#3a6db5" stroke="#1c1c1c" stroke-width="1"/>
    <rect x="-16" y="-24" width="32" height="10" fill="#1c1c1c"/>
    <rect x="-14" y="22" width="28" height="6" fill="#1c1c1c"/>
    <rect x="-24" y="-20" width="5" height="6" fill="#1c1c1c"/>
    <rect x="19" y="-20" width="5" height="6" fill="#1c1c1c"/>
  </g>
  <text x="168" y="119" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">You</text>

  <!-- a car hidden in the left blind spot -->
  <g transform="translate(99,150)">
    <rect x="-14" y="-26" width="28" height="52" rx="5" fill="#f2f2f2" stroke="#1c1c1c" stroke-width="1"/>
    <rect x="-12" y="-17" width="24" height="7" fill="#1c1c1c"/>
  </g>

  <!-- legend, right side -->
  <rect x="290" y="38" width="18" height="14" fill="#9ec3e6" stroke="#003F87" stroke-width="1"/>
  <text class="bs_lbl" x="314" y="49">Mirror view</text>
  <text class="bs_sub" x="314" y="62">Light blue: what your inside</text>
  <text class="bs_sub" x="314" y="74">and side mirrors show</text>

  <rect x="290" y="96" width="18" height="14" fill="url(#bs_hatch)" stroke="#1c1c1c" stroke-width="1"/>
  <text class="bs_lbl" x="314" y="107">Blind spot</text>
  <text class="bs_sub" x="314" y="120">Orange striped: behind each</text>
  <text class="bs_sub" x="314" y="132">shoulder, not in any mirror</text>

  <text class="bs_lbl" x="290" y="168">A whole car can hide here.</text>
  <text class="bs_sub" x="290" y="182">Before you change lanes, glance</text>
  <text class="bs_sub" x="290" y="194">over your shoulder through the</text>
  <text class="bs_sub" x="290" y="206">side window: a head check.</text>
</svg>
