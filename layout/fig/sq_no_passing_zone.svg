<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" font-family="Inter, Arial, sans-serif">
  <!-- Single sign for a picture question: no passing zone (no label; the question names shape and color in words) -->
  <g transform="translate(50,50) scale(1.000) translate(-0,-0)"><polygon points="-45,-31 45,0 -45,31" fill="#FFCD00" stroke="#1c1c1c" stroke-width="1" stroke-linejoin="round"/><polygon points="-41.5,-26 34,0 -41.5,26" fill="none" stroke="#1c1c1c" stroke-width="2" stroke-linejoin="round"/><text x="-19" y="-7" font-size="9" font-weight="800" fill="#1c1c1c" text-anchor="middle">NO</text><text x="-19" y="2.9" font-size="9" font-weight="800" fill="#1c1c1c" text-anchor="middle">PASSING</text><text x="-19" y="12.8" font-size="9" font-weight="800" fill="#1c1c1c" text-anchor="middle">ZONE</text></g>
</svg>
