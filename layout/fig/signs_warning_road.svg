<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 240" font-family="Inter, Arial, sans-serif">
  <!-- Warning signs for narrow roads, shoulders, slow vehicles and roads with no way out -->
  <style>
    .lbl { font-size: 11px; font-weight: 600; fill: #1c1c1c; text-anchor: middle; }
    .sub { font-size: 9.5px; font-weight: 500; fill: #555; text-anchor: middle; }
  </style>
  <!-- Road Narrows -->
  <g transform="translate(57.5,38) scale(0.820) translate(-0,-0)"><polygon points="0,-34 34,0 0,34 -34,0" fill="#FFCD00" stroke="#1c1c1c" stroke-width="1" stroke-linejoin="round"/><polygon points="0,-30 30,0 0,30 -30,0" fill="none" stroke="#1c1c1c" stroke-width="2.2" stroke-linejoin="round"/><text x="0" y="-1.5" font-size="7.4" font-weight="800" fill="#1c1c1c" text-anchor="middle">ROAD</text><text x="0" y="6.8" font-size="7.4" font-weight="800" fill="#1c1c1c" text-anchor="middle">NARROWS</text></g>
  <text class="lbl" x="57.5" y="86">Road Narrows</text>
  <text class="sub" x="57.5" y="99">Yellow diamond</text>
  <text class="sub" x="57.5" y="111">Road gets narrower</text>
  <!-- Narrow Bridge -->
  <g transform="translate(172.5,38) scale(0.820) translate(-0,-0)"><polygon points="0,-34 34,0 0,34 -34,0" fill="#FFCD00" stroke="#1c1c1c" stroke-width="1" stroke-linejoin="round"/><polygon points="0,-30 30,0 0,30 -30,0" fill="none" stroke="#1c1c1c" stroke-width="2.2" stroke-linejoin="round"/><text x="0" y="-1.6" font-size="7.8" font-weight="800" fill="#1c1c1c" text-anchor="middle">NARROW</text><text x="0" y="7.2" font-size="7.8" font-weight="800" fill="#1c1c1c" text-anchor="middle">BRIDGE</text></g>
  <text class="lbl" x="172.5" y="86">Narrow Bridge</text>
  <text class="sub" x="172.5" y="99">Yellow diamond</text>
  <text class="sub" x="172.5" y="111">Bridge narrower</text>
  <!-- One Lane Bridge -->
  <g transform="translate(287.5,38) scale(0.820) translate(-0,-0)"><polygon points="0,-34 34,0 0,34 -34,0" fill="#FFCD00" stroke="#1c1c1c" stroke-width="1" stroke-linejoin="round"/><polygon points="0,-30 30,0 0,30 -30,0" fill="none" stroke="#1c1c1c" stroke-width="2.2" stroke-linejoin="round"/><text x="0" y="-6.2" font-size="8.2" font-weight="800" fill="#1c1c1c" text-anchor="middle">ONE</text><text x="0" y="3" font-size="8.2" font-weight="800" fill="#1c1c1c" text-anchor="middle">LANE</text><text x="0" y="12.1" font-size="8.2" font-weight="800" fill="#1c1c1c" text-anchor="middle">BRIDGE</text></g>
  <text class="lbl" x="287.5" y="86">One Lane Bridge</text>
  <text class="sub" x="287.5" y="99">Yellow diamond</text>
  <text class="sub" x="287.5" y="111">Take turns crossing</text>
  <!-- Low Shoulder -->
  <g transform="translate(402.5,38) scale(0.820) translate(-0,-0)"><polygon points="0,-34 34,0 0,34 -34,0" fill="#FFCD00" stroke="#1c1c1c" stroke-width="1" stroke-linejoin="round"/><polygon points="0,-30 30,0 0,30 -30,0" fill="none" stroke="#1c1c1c" stroke-width="2.2" stroke-linejoin="round"/><text x="0" y="-1.4" font-size="6.9" font-weight="800" fill="#1c1c1c" text-anchor="middle">LOW</text><text x="0" y="6.3" font-size="6.9" font-weight="800" fill="#1c1c1c" text-anchor="middle">SHOULDER</text></g>
  <text class="lbl" x="402.5" y="86">Low Shoulder</text>
  <text class="sub" x="402.5" y="99">Yellow diamond</text>
  <text class="sub" x="402.5" y="111">Shoulder sits lower</text>
  <!-- Shoulder Drop-Off -->
  <g transform="translate(57.5,160) scale(0.673) translate(-0,-15)"><polygon points="0,-34 34,0 0,34 -34,0" fill="#FFCD00" stroke="#1c1c1c" stroke-width="1" stroke-linejoin="round"/><polygon points="0,-30 30,0 0,30 -30,0" fill="none" stroke="#1c1c1c" stroke-width="2.2" stroke-linejoin="round"/><rect x="-17" y="7" width="18" height="4.5" fill="#1c1c1c"/><rect x="1" y="13" width="11" height="3.5" fill="#1c1c1c"/><g transform="translate(-5,2) rotate(16) scale(0.9)"><rect x="-15" y="-15" width="28" height="13" rx="3" fill="#1c1c1c"/><path d="M-10,-15 L-7,-22 L5,-22 L8,-15 Z" fill="#1c1c1c"/><path d="M-7.5,-15.5 L-5.5,-20 L3.5,-20 L5.5,-15.5 Z" fill="#FFCD00"/><rect x="-12" y="-11" width="5" height="3" rx="1" fill="#FFCD00"/><rect x="5" y="-11" width="5" height="3" rx="1" fill="#FFCD00"/><rect x="-15" y="-3" width="6" height="7" rx="1" fill="#1c1c1c"/><rect x="7" y="-3" width="6" height="7" rx="1" fill="#1c1c1c"/></g><rect x="-30" y="39" width="60" height="25" rx="3" fill="#FFCD00" stroke="#1c1c1c" stroke-width="1"/><rect x="-28" y="41" width="56" height="21" rx="2" fill="none" stroke="#1c1c1c" stroke-width="1.4"/><text x="0" y="50" font-size="8" font-weight="800" fill="#1c1c1c" text-anchor="middle">SHOULDER</text><text x="0" y="59" font-size="8" font-weight="800" fill="#1c1c1c" text-anchor="middle">DROP-OFF</text></g>
  <text class="lbl" x="57.5" y="208">Shoulder Drop-Off</text>
  <text class="sub" x="57.5" y="221">Yellow diamond</text>
  <text class="sub" x="57.5" y="233">and yellow plaque</text>
  <!-- Horse-Drawn Vehicle -->
  <g transform="translate(172.5,160) scale(0.820) translate(-0,-0)"><polygon points="0,-34 34,0 0,34 -34,0" fill="#FFCD00" stroke="#1c1c1c" stroke-width="1" stroke-linejoin="round"/><polygon points="0,-30 30,0 0,30 -30,0" fill="none" stroke="#1c1c1c" stroke-width="2.2" stroke-linejoin="round"/><g transform="translate(0,2)"><ellipse cx="-7" cy="3" rx="9" ry="4.6" fill="#1c1c1c"/><polygon points="-14,2 -10,-1 -14,-11 -18,-9" fill="#1c1c1c"/><polygon points="-18,-11 -14,-12.5 -13,-10 -19.5,-3.5 -22,-5" fill="#1c1c1c"/><polygon points="-16.5,-11.5 -15.5,-15 -14,-11.8" fill="#1c1c1c"/><path d="M-13,6 L-15,15.5 M-10,7 L-9,15.5 M-2,6 L-3,15.5 M1,5 L2.5,15.5" fill="none" stroke="#1c1c1c" stroke-width="2.2"/><path d="M1.5,1 C4.5,3 4.5,8 3.5,11" fill="none" stroke="#1c1c1c" stroke-width="1.6"/><path d="M-1,0.5 L7,0.5" stroke="#1c1c1c" stroke-width="1.5"/><rect x="6" y="-8.5" width="11" height="12" fill="#1c1c1c"/><path d="M4.5,-10.5 L18,-10.5" stroke="#1c1c1c" stroke-width="2"/><circle cx="12" cy="9" r="5.5" fill="none" stroke="#1c1c1c" stroke-width="2"/><circle cx="12" cy="9" r="1.4" fill="#1c1c1c"/></g></g>
  <text class="lbl" x="172.5" y="208">Horse-Drawn Vehicle</text>
  <text class="sub" x="172.5" y="221">Yellow diamond</text>
  <text class="sub" x="172.5" y="233">Slow buggies ahead</text>
  <!-- Dead End -->
  <g transform="translate(287.5,160) scale(0.820) translate(-0,-0)"><polygon points="0,-34 34,0 0,34 -34,0" fill="#FFCD00" stroke="#1c1c1c" stroke-width="1" stroke-linejoin="round"/><polygon points="0,-30 30,0 0,30 -30,0" fill="none" stroke="#1c1c1c" stroke-width="2.2" stroke-linejoin="round"/><text x="0" y="-2.4" font-size="12" font-weight="800" fill="#1c1c1c" text-anchor="middle">DEAD</text><text x="0" y="11" font-size="12" font-weight="800" fill="#1c1c1c" text-anchor="middle">END</text></g>
  <text class="lbl" x="287.5" y="208">Dead End</text>
  <text class="sub" x="287.5" y="221">Yellow diamond</text>
  <text class="sub" x="287.5" y="233">No way through</text>
  <!-- No Outlet -->
  <g transform="translate(402.5,160) scale(0.820) translate(-0,-0)"><polygon points="0,-34 34,0 0,34 -34,0" fill="#FFCD00" stroke="#1c1c1c" stroke-width="1" stroke-linejoin="round"/><polygon points="0,-30 30,0 0,30 -30,0" fill="none" stroke="#1c1c1c" stroke-width="2.2" stroke-linejoin="round"/><text x="0" y="-2" font-size="10" font-weight="800" fill="#1c1c1c" text-anchor="middle">NO</text><text x="0" y="9.2" font-size="10" font-weight="800" fill="#1c1c1c" text-anchor="middle">OUTLET</text></g>
  <text class="lbl" x="402.5" y="208">No Outlet</text>
  <text class="sub" x="402.5" y="221">Yellow diamond</text>
  <text class="sub" x="402.5" y="233">Area has no exit</text>
</svg>
