<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 260" font-family="Inter, Arial, sans-serif">
  <!-- Warning signs: yellow diamonds with black symbols (chevron is a yellow rectangle) -->
  <style>
    .lbl { font-size: 11px; font-weight: 600; fill: #1c1c1c; text-anchor: middle; }
    .sub { font-size: 9.5px; font-weight: 500; fill: #555; text-anchor: middle; }
  </style>
  <!-- Curve -->
  <g transform="translate(41.5,36)">
    <g transform="scale(0.7)">
    <polygon points="0,-34 34,0 0,34 -34,0" fill="#FFCD00" stroke="#1c1c1c" stroke-width="1" stroke-linejoin="round"/>
    <polygon points="0,-30 30,0 0,30 -30,0" fill="none" stroke="#1c1c1c" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M-6,22 L-6,2 C-6,-8 -1,-12 6,-14" fill="none" stroke="#1c1c1c" stroke-width="4.5"/>
    <polygon points="13.0,-16.5 8.2,-9.3 4.6,-18.4" fill="#1c1c1c"/>
    </g>
  </g>
  <!-- Advisory speed plaque (drawn beside the curve sign; it is mounted below it) -->
  <g transform="translate(87.5,40)">
    <rect x="-15" y="-14" width="30" height="28" rx="3" fill="#FFCD00" stroke="#1c1c1c" stroke-width="1"/>
    <rect x="-12.5" y="-11.5" width="25" height="23" rx="2" fill="none" stroke="#1c1c1c" stroke-width="1.4"/>
    <text x="0" y="0" font-size="10" font-weight="800" fill="#1c1c1c" text-anchor="middle">25</text>
    <text x="0" y="9.5" font-size="9" font-weight="800" fill="#1c1c1c" text-anchor="middle">MPH</text>
  </g>
  <text class="lbl" x="57.5" y="74">Curve, 25 MPH</text>
  <text class="sub" x="57.5" y="87">Plaque is advice</text>
  <!-- Chevron alignment -->
  <g transform="translate(172.5,36)">
    <g transform="scale(0.7)">
    <rect x="-24" y="-32" width="48" height="64" fill="#FFCD00" stroke="#1c1c1c" stroke-width="1"/>
    <polygon points="-14,-20 0,-20 16,0 0,20 -14,20 2,0" fill="#1c1c1c"/>
    </g>
  </g>
  <text class="lbl" x="172.5" y="74">Chevron</text>
  <text class="sub" x="172.5" y="87">Outside of a curve</text>
  <!-- Merge (W4-1) -->
  <g transform="translate(287.5,36)">
    <g transform="scale(0.7)">
    <polygon points="0,-34 34,0 0,34 -34,0" fill="#FFCD00" stroke="#1c1c1c" stroke-width="1" stroke-linejoin="round"/>
    <polygon points="0,-30 30,0 0,30 -30,0" fill="none" stroke="#1c1c1c" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M-5,22 L-5,-12" fill="none" stroke="#1c1c1c" stroke-width="4.5"/>
    <polygon points="-5.0,-22.0 0.2,-14.3 -10.2,-14.3" fill="#1c1c1c"/>
    <path d="M14,22 Q14,8 -4,2" fill="none" stroke="#1c1c1c" stroke-width="4"/>
    </g>
  </g>
  <text class="lbl" x="287.5" y="74">Merge</text>
  <text class="sub" x="287.5" y="87">Traffic joins you</text>
  <!-- Lane Ends (W4-2) -->
  <g transform="translate(402.5,36)">
    <g transform="scale(0.7)">
    <polygon points="0,-34 34,0 0,34 -34,0" fill="#FFCD00" stroke="#1c1c1c" stroke-width="1" stroke-linejoin="round"/>
    <polygon points="0,-30 30,0 0,30 -30,0" fill="none" stroke="#1c1c1c" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M-11,23 L-11,-23" fill="none" stroke="#1c1c1c" stroke-width="4.5"/>
    <path d="M11,23 L11,2 L-1,-10 L-1,-23" fill="none" stroke="#1c1c1c" stroke-width="4.5"/>
    <line x1="0" y1="23" x2="0" y2="4" stroke="#1c1c1c" stroke-width="2" stroke-dasharray="3 3"/>
    </g>
  </g>
  <text class="lbl" x="402.5" y="74">Lane Ends</text>
  <text class="sub" x="402.5" y="87">Road loses a lane</text>
  <!-- Divided Highway (W6-1) -->
  <g transform="translate(57.5,120)">
    <g transform="scale(0.7)">
    <polygon points="0,-34 34,0 0,34 -34,0" fill="#FFCD00" stroke="#1c1c1c" stroke-width="1" stroke-linejoin="round"/>
    <polygon points="0,-30 30,0 0,30 -30,0" fill="none" stroke="#1c1c1c" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M-6,-24 L-6,-6 Q0,2 6,-6 L6,-24 Z" fill="#1c1c1c"/>
    <path d="M-15,-17 L-15,-6 Q-15,2 -6,6 L-6,13" fill="none" stroke="#1c1c1c" stroke-width="4"/>
    <polygon points="-6.0,22.0 -10.9,14.8 -1.1,14.8" fill="#1c1c1c"/>
    <path d="M6,22 L6,6 Q15,2 15,-6 L15,-8" fill="none" stroke="#1c1c1c" stroke-width="4"/>
    <polygon points="15.0,-18.0 19.9,-10.8 10.1,-10.8" fill="#1c1c1c"/>
    </g>
  </g>
  <text class="lbl" x="57.5" y="158">Divided Highway</text>
  <text class="sub" x="57.5" y="171">Median begins</text>
  <!-- Divided Highway Ends (W6-2) -->
  <g transform="translate(172.5,120)">
    <g transform="scale(0.7)">
    <polygon points="0,-34 34,0 0,34 -34,0" fill="#FFCD00" stroke="#1c1c1c" stroke-width="1" stroke-linejoin="round"/>
    <polygon points="0,-30 30,0 0,30 -30,0" fill="none" stroke="#1c1c1c" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M-6,24 L-6,6 Q0,-2 6,6 L6,24 Z" fill="#1c1c1c"/>
    <path d="M-6,-22 L-6,-6 Q-15,-2 -15,6 L-15,8" fill="none" stroke="#1c1c1c" stroke-width="4"/>
    <polygon points="-15.0,18.0 -19.9,10.8 -10.1,10.8" fill="#1c1c1c"/>
    <path d="M15,17 L15,6 Q15,-2 6,-6 L6,-13" fill="none" stroke="#1c1c1c" stroke-width="4"/>
    <polygon points="6.0,-22.0 10.9,-14.8 1.1,-14.8" fill="#1c1c1c"/>
    </g>
  </g>
  <text class="lbl" x="172.5" y="158">Divided Hwy. Ends</text>
  <text class="sub" x="172.5" y="171">Median ends</text>
  <!-- Two Way Traffic (W6-3) -->
  <g transform="translate(287.5,120)">
    <g transform="scale(0.7)">
    <polygon points="0,-34 34,0 0,34 -34,0" fill="#FFCD00" stroke="#1c1c1c" stroke-width="1" stroke-linejoin="round"/>
    <polygon points="0,-30 30,0 0,30 -30,0" fill="none" stroke="#1c1c1c" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M-8,-14 L-8,14" fill="none" stroke="#1c1c1c" stroke-width="4.5"/>
    <polygon points="-8.0,23.0 -13.2,15.3 -2.8,15.3" fill="#1c1c1c"/>
    <path d="M8,14 L8,-14" fill="none" stroke="#1c1c1c" stroke-width="4.5"/>
    <polygon points="8.0,-23.0 13.2,-15.3 2.8,-15.3" fill="#1c1c1c"/>
    </g>
  </g>
  <text class="lbl" x="287.5" y="158">Two Way Traffic</text>
  <text class="sub" x="287.5" y="171">Oncoming ahead</text>
  <!-- Slippery When Wet -->
  <g transform="translate(402.5,120)">
    <g transform="scale(0.7)">
    <polygon points="0,-34 34,0 0,34 -34,0" fill="#FFCD00" stroke="#1c1c1c" stroke-width="1" stroke-linejoin="round"/>
    <polygon points="0,-30 30,0 0,30 -30,0" fill="none" stroke="#1c1c1c" stroke-width="2.2" stroke-linejoin="round"/>
    <rect x="-11.55" y="-14.3" width="23.1" height="10.5" rx="3.1500000000000004" fill="#1c1c1c"/>
    <path d="M-7.3500000000000005,-14.3 L-4.2,-20.6 L4.2,-20.6 L7.3500000000000005,-14.3 Z" fill="#1c1c1c"/>
    <rect x="-10.5" y="-4.85" width="5.25" height="4.2" fill="#1c1c1c"/>
    <rect x="5.25" y="-4.85" width="5.25" height="4.2" fill="#1c1c1c"/>
    <path d="M-6,0 C-12,6 -1,11 -7,18" fill="none" stroke="#1c1c1c" stroke-width="2.4"/>
    <path d="M6,0 C0,6 11,11 5,18" fill="none" stroke="#1c1c1c" stroke-width="2.4"/>
    </g>
  </g>
  <text class="lbl" x="402.5" y="158">Slippery When Wet</text>
  <text class="sub" x="402.5" y="171">Car, wavy skid marks</text>
  <!-- Crossroad -->
  <g transform="translate(57.5,204)">
    <g transform="scale(0.7)">
    <polygon points="0,-34 34,0 0,34 -34,0" fill="#FFCD00" stroke="#1c1c1c" stroke-width="1" stroke-linejoin="round"/>
    <polygon points="0,-30 30,0 0,30 -30,0" fill="none" stroke="#1c1c1c" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M0,-22 L0,22 M-22,0 L22,0" fill="none" stroke="#1c1c1c" stroke-width="5"/>
    </g>
  </g>
  <text class="lbl" x="57.5" y="242">Crossroad</text>
  <text class="sub" x="57.5" y="255">Plus sign</text>
  <!-- T intersection -->
  <g transform="translate(172.5,204)">
    <g transform="scale(0.7)">
    <polygon points="0,-34 34,0 0,34 -34,0" fill="#FFCD00" stroke="#1c1c1c" stroke-width="1" stroke-linejoin="round"/>
    <polygon points="0,-30 30,0 0,30 -30,0" fill="none" stroke="#1c1c1c" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M-20,-8 L20,-8 M0,-8 L0,22" fill="none" stroke="#1c1c1c" stroke-width="5"/>
    </g>
  </g>
  <text class="lbl" x="172.5" y="242">T Intersection</text>
  <text class="sub" x="172.5" y="255">Your road ends</text>
  <!-- Stop Ahead -->
  <g transform="translate(287.5,204)">
    <g transform="scale(0.7)">
    <polygon points="0,-34 34,0 0,34 -34,0" fill="#FFCD00" stroke="#1c1c1c" stroke-width="1" stroke-linejoin="round"/>
    <polygon points="0,-30 30,0 0,30 -30,0" fill="none" stroke="#1c1c1c" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M0,22 L0,13" fill="none" stroke="#1c1c1c" stroke-width="4.5"/>
    <polygon points="0.0,6.0 4.5,12.6 -4.5,12.6" fill="#1c1c1c"/>
    <g transform="translate(0,-6)">
    <polygon points="-5.4,-13.0 5.4,-13.0 13.0,-5.4 13.0,5.4 5.4,13.0 -5.4,13.0 -13.0,5.4 -13.0,-5.4" fill="#fff" stroke="#1c1c1c" stroke-width="1"/>
    <polygon points="-5.0,-12.0 5.0,-12.0 12.0,-5.0 12.0,5.0 5.0,12.0 -5.0,12.0 -12.0,5.0 -12.0,-5.0" fill="#C8102E"/>
    </g>
    </g>
  </g>
  <text class="lbl" x="287.5" y="242">Stop Ahead</text>
  <text class="sub" x="287.5" y="255">Red octagon symbol</text>
  <!-- Signal Ahead -->
  <g transform="translate(402.5,204)">
    <g transform="scale(0.7)">
    <polygon points="0,-34 34,0 0,34 -34,0" fill="#FFCD00" stroke="#1c1c1c" stroke-width="1" stroke-linejoin="round"/>
    <polygon points="0,-30 30,0 0,30 -30,0" fill="none" stroke="#1c1c1c" stroke-width="2.2" stroke-linejoin="round"/>
    <rect x="-8" y="-21" width="16" height="40" rx="3" fill="#1c1c1c"/>
    <circle cy="-12" r="4.6" fill="#C8102E"/>
    <circle cy="0" r="4.6" fill="#FFCD00" stroke="#fff" stroke-width="0.8"/>
    <circle cy="12" r="4.6" fill="#006B3F"/>
    </g>
  </g>
  <text class="lbl" x="402.5" y="242">Signal Ahead</text>
  <text class="sub" x="402.5" y="255">Traffic light symbol</text>
</svg>
