<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 156" font-family="Inter, Arial, sans-serif">
  <!-- School signs: fluorescent yellow-green pentagon, crossing plaque, school speed limit and end of zone -->
  <style>
    .lbl { font-size: 11px; font-weight: 600; fill: #1c1c1c; text-anchor: middle; }
    .sub { font-size: 9.5px; font-weight: 500; fill: #555; text-anchor: middle; }
  </style>
  <!-- School zone (S1-1) -->
  <g transform="translate(57.5,62)">
    <polygon points="0,-32.0 29.0,-6.399999999999999 29.0,32.0 -29.0,32.0 -29.0,-6.399999999999999" fill="#C6D52B" stroke="#1c1c1c" stroke-width="1" stroke-linejoin="round"/>
    <polygon points="0,-28.0 25.0,-6.399999999999999 25.0,28.0 -25.0,28.0 -25.0,-6.399999999999999" fill="none" stroke="#1c1c1c" stroke-width="2.2" stroke-linejoin="round"/>
    <circle cx="-9.1" cy="-6.4" r="3.8" fill="#1c1c1c"/>
    <path d="M-8.0,-1.1 L-7.0,10.4" fill="none" stroke="#1c1c1c" stroke-width="5.25"/>
    <path d="M-7.0,10.4 L-13.2,22.0" fill="none" stroke="#1c1c1c" stroke-width="3.57"/>
    <path d="M-7.0,10.4 L-1.7,22.0" fill="none" stroke="#1c1c1c" stroke-width="3.57"/>
    <path d="M-8.0,1.0 L-14.3,8.3" fill="none" stroke="#1c1c1c" stroke-width="2.94"/>
    <path d="M-8.0,1.0 L-1.7,7.3" fill="none" stroke="#1c1c1c" stroke-width="2.94"/>
    <circle cx="8.2" cy="-0.9" r="3.1" fill="#1c1c1c"/>
    <path d="M9.0,3.3 L9.8,12.7" fill="none" stroke="#1c1c1c" stroke-width="4.25"/>
    <path d="M9.8,12.7 L4.8,22.0" fill="none" stroke="#1c1c1c" stroke-width="2.8899999999999997"/>
    <path d="M9.8,12.7 L14.1,22.0" fill="none" stroke="#1c1c1c" stroke-width="2.8899999999999997"/>
    <path d="M9.0,5.0 L3.9,11.0" fill="none" stroke="#1c1c1c" stroke-width="2.38"/>
    <path d="M9.0,5.0 L14.1,10.1" fill="none" stroke="#1c1c1c" stroke-width="2.38"/>
  </g>
  <text class="lbl" x="57.5" y="136">School Zone</text>
  <text class="sub" x="57.5" y="149">Yellow-green pentagon</text>
  <!-- School crossing: pentagon with downward arrow plaque -->
  <g transform="translate(172.5,50)">
    <polygon points="0,-32.0 29.0,-6.399999999999999 29.0,32.0 -29.0,32.0 -29.0,-6.399999999999999" fill="#C6D52B" stroke="#1c1c1c" stroke-width="1" stroke-linejoin="round"/>
    <polygon points="0,-28.0 25.0,-6.399999999999999 25.0,28.0 -25.0,28.0 -25.0,-6.399999999999999" fill="none" stroke="#1c1c1c" stroke-width="2.2" stroke-linejoin="round"/>
    <circle cx="-9.1" cy="-6.4" r="3.8" fill="#1c1c1c"/>
    <path d="M-8.0,-1.1 L-7.0,10.4" fill="none" stroke="#1c1c1c" stroke-width="5.25"/>
    <path d="M-7.0,10.4 L-13.2,22.0" fill="none" stroke="#1c1c1c" stroke-width="3.57"/>
    <path d="M-7.0,10.4 L-1.7,22.0" fill="none" stroke="#1c1c1c" stroke-width="3.57"/>
    <path d="M-8.0,1.0 L-14.3,8.3" fill="none" stroke="#1c1c1c" stroke-width="2.94"/>
    <path d="M-8.0,1.0 L-1.7,7.3" fill="none" stroke="#1c1c1c" stroke-width="2.94"/>
    <circle cx="8.2" cy="-0.9" r="3.1" fill="#1c1c1c"/>
    <path d="M9.0,3.3 L9.8,12.7" fill="none" stroke="#1c1c1c" stroke-width="4.25"/>
    <path d="M9.8,12.7 L4.8,22.0" fill="none" stroke="#1c1c1c" stroke-width="2.8899999999999997"/>
    <path d="M9.8,12.7 L14.1,22.0" fill="none" stroke="#1c1c1c" stroke-width="2.8899999999999997"/>
    <path d="M9.0,5.0 L3.9,11.0" fill="none" stroke="#1c1c1c" stroke-width="2.38"/>
    <path d="M9.0,5.0 L14.1,10.1" fill="none" stroke="#1c1c1c" stroke-width="2.38"/>
    <g transform="translate(0,48)">
    <rect x="-26" y="-13" width="52" height="26" rx="3" fill="#C6D52B" stroke="#1c1c1c" stroke-width="1"/>
    <rect x="-23.5" y="-10.5" width="47" height="21" rx="2" fill="none" stroke="#1c1c1c" stroke-width="1.6"/>
    <path d="M8,-6 L-3,4" fill="none" stroke="#1c1c1c" stroke-width="3.5"/>
    <polygon points="-9.0,9.0 -7.3,1.9 -1.7,8.0" fill="#1c1c1c"/>
    </g>
  </g>
  <text class="lbl" x="172.5" y="136">School Crossing</text>
  <text class="sub" x="172.5" y="149">Arrow plaque points down</text>
  <!-- School speed limit assembly -->
  <g transform="translate(287.5,60)">
    <rect x="-27" y="-58" width="54" height="18" rx="2" fill="#C6D52B" stroke="#1c1c1c" stroke-width="1.6"/>
    <text x="0" y="-45" font-size="10" font-weight="800" fill="#1c1c1c" text-anchor="middle">SCHOOL</text>
    <rect x="-27" y="-38" width="54" height="64" rx="3" fill="#fff" stroke="#1c1c1c" stroke-width="2"/>
    <text x="0" y="-25" font-size="10" font-weight="800" fill="#1c1c1c" text-anchor="middle">SPEED</text>
    <text x="0" y="-14" font-size="10" font-weight="800" fill="#1c1c1c" text-anchor="middle">LIMIT</text>
    <text x="0" y="16" font-size="24" font-weight="800" fill="#1c1c1c" text-anchor="middle">20</text>
    <rect x="-27" y="28" width="54" height="28" rx="2" fill="#fff" stroke="#1c1c1c" stroke-width="1.6"/>
    <text x="0" y="40" font-size="9.5" font-weight="800" fill="#1c1c1c" text-anchor="middle">WHEN</text>
    <text x="0" y="51" font-size="9.5" font-weight="800" fill="#1c1c1c" text-anchor="middle">FLASHING</text>
  </g>
  <text class="lbl" x="287.5" y="136">School Speed Limit</text>
  <text class="sub" x="287.5" y="149">White; number varies by state</text>
  <!-- End School Zone (S5-2) -->
  <g transform="translate(402.5,62)">
    <rect x="-27.0" y="-35.0" width="54" height="70" rx="4" fill="#fff" stroke="#1c1c1c" stroke-width="1"/>
    <rect x="-24.0" y="-32.0" width="48" height="64" rx="2" fill="none" stroke="#1c1c1c" stroke-width="2"/>
    <text x="0" y="-10" font-size="12" font-weight="800" fill="#1c1c1c" text-anchor="middle">END</text>
    <text x="0" y="5" font-size="12" font-weight="800" fill="#1c1c1c" text-anchor="middle">SCHOOL</text>
    <text x="0" y="20" font-size="12" font-weight="800" fill="#1c1c1c" text-anchor="middle">ZONE</text>
  </g>
  <text class="lbl" x="402.5" y="136">End School Zone</text>
  <text class="sub" x="402.5" y="149">White rectangle</text>
</svg>
