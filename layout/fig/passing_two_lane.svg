<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 170" font-family="Inter, Arial, sans-serif">
  <!-- Permit Path figure: passing on a two-lane road. Broken yellow line on your side, move fully into the left lane, return when both headlights of the passed car show in your inside mirror. Traffic in your lane moves left to right. -->
  <style>
    .pt_lbl { font-size: 11px; font-weight: 600; fill: #1c1c1c; text-anchor: middle; }
    .pt_sub { font-size: 9.5px; font-weight: 500; fill: #555; text-anchor: middle; }
    .pt_num { font-size: 10px; font-weight: 700; fill: #fff; text-anchor: middle; }
  </style>
  <defs>
    <marker id="ah_pt" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c1c1c"/></marker>
  </defs>

  <!-- road -->
  <rect x="0" y="20" width="460" height="70" fill="#d9d9d9"/>
  <line x1="0" y1="21" x2="460" y2="21" stroke="#888" stroke-width="3.5"/><line x1="0" y1="21" x2="460" y2="21" stroke="#fff" stroke-width="2"/>
  <line x1="0" y1="89" x2="460" y2="89" stroke="#888" stroke-width="3.5"/><line x1="0" y1="89" x2="460" y2="89" stroke="#fff" stroke-width="2"/>
  <!-- center line: broken yellow (passing allowed from your side) -->
  <line x1="0" y1="55" x2="460" y2="55" stroke="#888" stroke-width="3.5" stroke-dasharray="16 12"/><line x1="0" y1="55" x2="460" y2="55" stroke="#FFCD00" stroke-width="2" stroke-dasharray="16 12"/>

  <!-- slower car being passed (your lane, heading right) -->
  <g transform="translate(250,72)"><rect x="-18" y="-9" width="36" height="18" rx="3" fill="#f2f2f2" stroke="#1c1c1c" stroke-width="1"/><rect x="6" y="-7" width="5" height="14" fill="#1c1c1c"/></g>

  <!-- your path -->
  <path d="M60,72 L95,72 C125,72 125,38 155,38 L330,38 C360,38 360,72 390,72 L448,72" fill="none" stroke="#1c1c1c" stroke-width="2.5" marker-end="url(#ah_pt)"/>
  <g transform="translate(45,72)"><rect x="-18" y="-9" width="36" height="18" rx="3" fill="#3a6db5" stroke="#1c1c1c" stroke-width="1"/><rect x="6" y="-7" width="5" height="14" fill="#1c1c1c"/></g>
  <text x="41" y="76" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">You</text>

  <!-- sight line: both headlights of the passed car visible in your inside mirror -->

  <circle cx="110" cy="12" r="8" fill="#1c1c1c"/><text class="pt_num" x="110" y="16">1</text>
  <circle cx="250" cy="12" r="8" fill="#1c1c1c"/><text class="pt_num" x="250" y="16">2</text>
  <circle cx="375" cy="12" r="8" fill="#1c1c1c"/><text class="pt_num" x="375" y="16">3</text>

  <text class="pt_lbl" x="110" y="118">Check, signal left</text>
  <text class="pt_sub" x="110" y="131">Line on your side is broken</text>
  <text class="pt_sub" x="110" y="143">yellow and the road ahead</text>
  <text class="pt_sub" x="110" y="155">is clear far enough</text>
  <text class="pt_lbl" x="250" y="118">Speed up smoothly</text>
  <text class="pt_sub" x="250" y="131">Fully in the left lane,</text>
  <text class="pt_sub" x="250" y="143">never over the limit</text>
  <text class="pt_lbl" x="375" y="118">Signal right, return</text>
  <text class="pt_sub" x="375" y="131">When both headlights of the</text>
  <text class="pt_sub" x="375" y="143">car you passed show in</text>
  <text class="pt_sub" x="375" y="155">your inside mirror</text>
</svg>
