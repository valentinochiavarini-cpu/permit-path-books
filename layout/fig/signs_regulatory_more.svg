<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 244" font-family="Inter, Arial, sans-serif">
  <!-- More regulatory signs: turn and lane rules, Keep Right, and the two passing signs -->
  <style>
    .lbl { font-size: 11px; font-weight: 600; fill: #1c1c1c; text-anchor: middle; }
    .sub { font-size: 9.5px; font-weight: 500; fill: #555; text-anchor: middle; }
  </style>
  <!-- No Left Turn: black arrow under red circle and slash -->
  <g transform="translate(77,46)">
    <rect x="-34" y="-34" width="68" height="68" rx="4" fill="#fff" stroke="#1c1c1c" stroke-width="1"/>
    <rect x="-31" y="-31" width="62" height="62" rx="3" fill="none" stroke="#1c1c1c" stroke-width="2"/>
    <path d="M6,22 L6,0 Q6,-8 -2,-8 L-9,-8" fill="none" stroke="#1c1c1c" stroke-width="6"/>
    <polygon points="-19.0,-8.0 -10.2,-14.0 -10.2,-2.0" fill="#1c1c1c"/>
    <circle r="26" fill="none" stroke="#C8102E" stroke-width="5"/>
    <line x1="-18.4" y1="-18.4" x2="18.4" y2="18.4" stroke="#C8102E" stroke-width="5"/>
  </g>
  <text class="lbl" x="77" y="100">No Left Turn</text>
  <text class="sub" x="77" y="113">Red circle and slash</text>
  <!-- No U-Turn -->
  <g transform="translate(230,46)">
    <rect x="-34" y="-34" width="68" height="68" rx="4" fill="#fff" stroke="#1c1c1c" stroke-width="1"/>
    <rect x="-31" y="-31" width="62" height="62" rx="3" fill="none" stroke="#1c1c1c" stroke-width="2"/>
    <path d="M9,22 L9,-4 A9,9 0 0 0 -9,-4 L-9,6" fill="none" stroke="#1c1c1c" stroke-width="6"/>
    <polygon points="-9.0,16.0 -15.0,7.2 -3.0,7.2" fill="#1c1c1c"/>
    <circle r="26" fill="none" stroke="#C8102E" stroke-width="5"/>
    <line x1="-18.4" y1="-18.4" x2="18.4" y2="18.4" stroke="#C8102E" stroke-width="5"/>
  </g>
  <text class="lbl" x="230" y="100">No U-Turn</text>
  <text class="sub" x="230" y="113">Red circle and slash</text>
  <!-- Keep Right: arrow passes to the right of an island -->
  <g transform="translate(383,46)">
    <rect x="-26.0" y="-35.0" width="52" height="70" rx="4" fill="#fff" stroke="#1c1c1c" stroke-width="1"/>
    <rect x="-23.0" y="-32.0" width="46" height="64" rx="2" fill="none" stroke="#1c1c1c" stroke-width="2"/>
    <path d="M-19,-29 L-5,-29 L-5,-12 Q-5,-4 -12,-4 Q-19,-4 -19,-12 Z" fill="#1c1c1c"/>
    <path d="M2,29 L2,14 Q2,4 8,0 L8,-17" fill="none" stroke="#1c1c1c" stroke-width="5.5"/>
    <polygon points="8.0,-28.0 13.6,-19.8 2.4,-19.8" fill="#1c1c1c"/>
  </g>
  <text class="lbl" x="383" y="100">Keep Right</text>
  <text class="sub" x="383" y="113">White rectangle</text>
  <!-- Lane use: left turn only -->
  <g transform="translate(77,170)">
    <rect x="-26.0" y="-35.0" width="52" height="70" rx="4" fill="#fff" stroke="#1c1c1c" stroke-width="1"/>
    <rect x="-23.0" y="-32.0" width="46" height="64" rx="2" fill="none" stroke="#1c1c1c" stroke-width="2"/>
    <path d="M6,6 L6,-6 Q6,-12 0,-12 L-6,-12" fill="none" stroke="#1c1c1c" stroke-width="5.5"/>
    <polygon points="-16.0,-12.0 -7.8,-17.6 -7.8,-6.4" fill="#1c1c1c"/>
    <text x="0" y="24" font-size="12" font-weight="800" fill="#1c1c1c" text-anchor="middle">ONLY</text>
  </g>
  <text class="lbl" x="77" y="224">Left Turn Only</text>
  <text class="sub" x="77" y="237">White rectangle, black arrow</text>
  <!-- Do Not Pass: right side of road -->
  <g transform="translate(230,170)">
    <rect x="-26.0" y="-35.0" width="52" height="70" rx="4" fill="#fff" stroke="#1c1c1c" stroke-width="1"/>
    <rect x="-23.0" y="-32.0" width="46" height="64" rx="2" fill="none" stroke="#1c1c1c" stroke-width="2"/>
    <text x="0" y="-11" font-size="13" font-weight="800" fill="#1c1c1c" text-anchor="middle">DO</text>
    <text x="0" y="5" font-size="13" font-weight="800" fill="#1c1c1c" text-anchor="middle">NOT</text>
    <text x="0" y="21" font-size="13" font-weight="800" fill="#1c1c1c" text-anchor="middle">PASS</text>
  </g>
  <text class="lbl" x="230" y="224">Do Not Pass</text>
  <text class="sub" x="230" y="237">White rectangle, right side</text>
  <!-- No Passing Zone pennant: left side of road -->
  <g transform="translate(383,170)">
    <polygon points="-56,-34 56,0 -56,34" fill="#FFCD00" stroke="#1c1c1c" stroke-width="1" stroke-linejoin="round"/>
    <polygon points="-52,-28 43,0 -52,28" fill="none" stroke="#1c1c1c" stroke-width="2" stroke-linejoin="round"/>
    <text x="-26" y="-7" font-size="9" font-weight="800" fill="#1c1c1c" text-anchor="middle">NO</text>
    <text x="-26" y="4" font-size="9" font-weight="800" fill="#1c1c1c" text-anchor="middle">PASSING</text>
    <text x="-26" y="15" font-size="9" font-weight="800" fill="#1c1c1c" text-anchor="middle">ZONE</text>
  </g>
  <text class="lbl" x="383" y="224">No Passing Zone</text>
  <text class="sub" x="383" y="237">Yellow pennant, left side</text>
</svg>
