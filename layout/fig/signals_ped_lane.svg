<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 246" font-family="Inter, Arial, sans-serif">
  <!-- Pedestrian signals (MUTCD 11th ed. 4I.02, 4I.04: walking person white, upraised hand Portland orange, countdown while the hand flashes) and lane control signals (4T.02, 4T.03) -->
  <style>
    .signals_ped_lane_lbl { font-size: 11px; font-weight: 600; fill: #1c1c1c; text-anchor: middle; }
    .signals_ped_lane_sub { font-size: 9.5px; font-weight: 500; fill: #555; text-anchor: middle; }
  </style>

  <text class="signals_ped_lane_lbl" x="10" y="12" style="text-anchor:start">Pedestrian signals</text>
  <rect x="52" y="20" width="50" height="50" rx="4" fill="#1c1c1c"/>
  <g transform="translate(77,46)" fill="none" stroke="#fff" stroke-linecap="round" stroke-width="3.2"><circle cx="1" cy="-15" r="3.6" fill="#fff" stroke="none"/><path d="M0,-9 L-2,4"/><path d="M-2,4 L-8,16"/><path d="M-2,4 L4,9 L5,17"/><path d="M0,-8 L-7,-1 L-9,6"/><path d="M0,-8 L6,-2 L10,0"/></g>
  <text class="signals_ped_lane_lbl" x="77" y="86">White walking person</text>
  <text class="signals_ped_lane_sub" x="77" y="99">People may start to cross</text>
  <rect x="183" y="20" width="94" height="50" rx="4" fill="#1c1c1c"/>
  <g transform="translate(207,47)" fill="#F47920"><rect x="-8" y="-4" width="16" height="16" rx="4"/><rect x="-8" y="-15" width="3.6" height="14" rx="1.8"/><rect x="-3.8" y="-18" width="3.6" height="17" rx="1.8"/><rect x="0.4" y="-17" width="3.6" height="16" rx="1.8"/><rect x="4.6" y="-14" width="3.4" height="13" rx="1.7"/><rect x="-14.5" y="-3" width="4" height="12" rx="2" transform="rotate(-28,-12.5,3)"/></g>
  <line x1="176" y1="30" x2="170" y2="26" stroke="#1c1c1c" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="175" y1="45" x2="168" y2="45" stroke="#1c1c1c" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="176" y1="60" x2="170" y2="64" stroke="#1c1c1c" stroke-width="1.8" stroke-linecap="round"/>
  <text x="253" y="56" font-size="26" font-weight="800" fill="#F47920" text-anchor="middle">12</text>
  <text class="signals_ped_lane_lbl" x="230" y="86">Flashing orange hand</text>
  <text class="signals_ped_lane_sub" x="230" y="99">Do not start; finish crossing</text>
  <text class="signals_ped_lane_sub" x="230" y="112">Number: seconds left to cross</text>
  <rect x="358" y="20" width="50" height="50" rx="4" fill="#1c1c1c"/>
  <g transform="translate(383,47)" fill="#F47920"><rect x="-8" y="-4" width="16" height="16" rx="4"/><rect x="-8" y="-15" width="3.6" height="14" rx="1.8"/><rect x="-3.8" y="-18" width="3.6" height="17" rx="1.8"/><rect x="0.4" y="-17" width="3.6" height="16" rx="1.8"/><rect x="4.6" y="-14" width="3.4" height="13" rx="1.7"/><rect x="-14.5" y="-3" width="4" height="12" rx="2" transform="rotate(-28,-12.5,3)"/></g>
  <text class="signals_ped_lane_lbl" x="383" y="86">Steady orange hand</text>
  <text class="signals_ped_lane_sub" x="383" y="99">Do not enter the street</text>
  <text class="signals_ped_lane_lbl" x="10" y="134" style="text-anchor:start">Lane control signals over each lane</text>
  <rect x="20" y="142" width="420" height="7" fill="#888"/>
  <rect x="20" y="186" width="420" height="26" fill="#d9d9d9"/>
  <rect x="158.75" y="188" width="2.5" height="5" fill="#fff" stroke="#888" stroke-width="0.6"/>
  <rect x="158.75" y="197" width="2.5" height="5" fill="#fff" stroke="#888" stroke-width="0.6"/>
  <rect x="158.75" y="206" width="2.5" height="5" fill="#fff" stroke="#888" stroke-width="0.6"/>
  <rect x="298.75" y="188" width="2.5" height="5" fill="#fff" stroke="#888" stroke-width="0.6"/>
  <rect x="298.75" y="197" width="2.5" height="5" fill="#fff" stroke="#888" stroke-width="0.6"/>
  <rect x="298.75" y="206" width="2.5" height="5" fill="#fff" stroke="#888" stroke-width="0.6"/>
  <rect x="88" y="149" width="4" height="4" fill="#888"/>
  <rect x="72" y="152" width="36" height="32" rx="3" fill="#1c1c1c"/>
  <polygon points="86,157 94,157 94,167 100,167 90,180 80,167 86,167" fill="#006B3F" stroke="#fff" stroke-width="1"/>
  <text class="signals_ped_lane_lbl" x="90" y="226">Green arrow, pointing down</text>
  <text class="signals_ped_lane_sub" x="90" y="239">Lane open: you may drive in it</text>
  <rect x="228" y="149" width="4" height="4" fill="#888"/>
  <rect x="212" y="152" width="36" height="32" rx="3" fill="#1c1c1c"/>
  <g stroke="#fff" stroke-width="7" stroke-linecap="round"><line x1="221" y1="159" x2="239" y2="177"/><line x1="239" y1="159" x2="221" y2="177"/></g>
  <g stroke="#FFCD00" stroke-width="4.6" stroke-linecap="round"><line x1="221" y1="159" x2="239" y2="177"/><line x1="239" y1="159" x2="221" y2="177"/></g>
  <text class="signals_ped_lane_lbl" x="230" y="226">Steady yellow X</text>
  <text class="signals_ped_lane_sub" x="230" y="239">Lane closing: move out safely</text>
  <rect x="368" y="149" width="4" height="4" fill="#888"/>
  <rect x="352" y="152" width="36" height="32" rx="3" fill="#1c1c1c"/>
  <g stroke="#fff" stroke-width="7" stroke-linecap="round"><line x1="361" y1="159" x2="379" y2="177"/><line x1="379" y1="159" x2="361" y2="177"/></g>
  <g stroke="#C8102E" stroke-width="4.6" stroke-linecap="round"><line x1="361" y1="159" x2="379" y2="177"/><line x1="379" y1="159" x2="361" y2="177"/></g>
  <text class="signals_ped_lane_lbl" x="370" y="226">Steady red X</text>
  <text class="signals_ped_lane_sub" x="370" y="239">Lane closed: do not drive in it</text>
</svg>
