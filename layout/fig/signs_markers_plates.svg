<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 290" font-family="Inter, Arial, sans-serif">
  <!-- Object markers, two more prohibition signs, road entering curve, route plates and the left exit tab -->
  <style>
    .signs_markers_plates_lbl { font-size: 11px; font-weight: 600; fill: #1c1c1c; text-anchor: middle; }
    .signs_markers_plates_sub { font-size: 9.5px; font-weight: 500; fill: #555; text-anchor: middle; }
  </style>
  <defs>
    <clipPath id="signs_markers_plates_om3"><rect x="-12" y="-34" width="24" height="68" rx="2"/></clipPath>
    <marker id="signs_markers_plates_ah" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1c1c1c"/></marker>
  </defs>
  <!-- Object marker OM3-R: black and yellow stripes sloping down toward the side traffic passes (right) -->
  <g transform="translate(62,48)">
    <g clip-path="url(#signs_markers_plates_om3)">
      <rect x="-12" y="-34" width="24" height="68" fill="#FFCD00"/>
      <g stroke="#1c1c1c" stroke-width="6.5">
        <line x1="-40" y1="-62" x2="40" y2="18"/><line x1="-40" y1="-44" x2="40" y2="36"/><line x1="-40" y1="-26" x2="40" y2="54"/><line x1="-40" y1="-8" x2="40" y2="72"/><line x1="-40" y1="10" x2="40" y2="90"/><line x1="-40" y1="-80" x2="40" y2="0"/>
      </g>
    </g>
    <rect x="-12" y="-34" width="24" height="68" rx="2" fill="none" stroke="#1c1c1c" stroke-width="1"/>
  </g>
  <text class="signs_markers_plates_lbl" x="62" y="104">Object Marker</text>
  <text class="signs_markers_plates_sub" x="62" y="117">Yellow and black stripes;</text>
  <text class="signs_markers_plates_sub" x="62" y="129">pass on the low side</text>
  <!-- End of road marker OM4-1: red diamond -->
  <g transform="translate(172,48)">
    <polygon points="0,-33 33,0 0,33 -33,0" fill="#C8102E" stroke="#1c1c1c" stroke-width="1"/>
  </g>
  <text class="signs_markers_plates_lbl" x="172" y="104">End of Road</text>
  <text class="signs_markers_plates_sub" x="172" y="117">Red diamond:</text>
  <text class="signs_markers_plates_sub" x="172" y="129">stop or turn</text>
  <!-- No Bicycles R5-6: black bicycle, red circle and slash, white square -->
  <g transform="translate(287,48)">
    <rect x="-34" y="-34" width="68" height="68" rx="4" fill="#fff" stroke="#1c1c1c" stroke-width="1"/>
    <rect x="-31" y="-31" width="62" height="62" rx="3" fill="none" stroke="#1c1c1c" stroke-width="2"/>
    <g fill="none" stroke="#1c1c1c" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round">
      <circle cx="-12" cy="7" r="8"/><circle cx="12" cy="7" r="8"/>
      <path d="M-12,7 L-4,-6 L8,-6 L12,7 M-4,-6 L0,7 L8,-6 M-6,-10 L-1,-10 M8,-6 L6,-12 L10,-12"/>
    </g>
    <circle r="26" fill="none" stroke="#C8102E" stroke-width="5"/>
    <line x1="-18.4" y1="-18.4" x2="18.4" y2="18.4" stroke="#C8102E" stroke-width="5"/>
  </g>
  <text class="signs_markers_plates_lbl" x="287" y="104">No Bicycles</text>
  <text class="signs_markers_plates_sub" x="287" y="117">Red circle and slash</text>
  <!-- No Pedestrian Crossing R9-3: black walking person, red circle and slash, white square -->
  <g transform="translate(398,48)">
    <rect x="-34" y="-34" width="68" height="68" rx="4" fill="#fff" stroke="#1c1c1c" stroke-width="1"/>
    <rect x="-31" y="-31" width="62" height="62" rx="3" fill="none" stroke="#1c1c1c" stroke-width="2"/>
    <circle cx="1" cy="-16" r="4.2" fill="#1c1c1c"/>
    <g fill="none" stroke="#1c1c1c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0,-9 L-2,5"/><path d="M-2,5 L-9,17 M-2,5 L6,17"/><path d="M-8,-1 L-1,-8 L7,-2"/>
    </g>
    <circle r="26" fill="none" stroke="#C8102E" stroke-width="5"/>
    <line x1="-18.4" y1="-18.4" x2="18.4" y2="18.4" stroke="#C8102E" stroke-width="5"/>
  </g>
  <text class="signs_markers_plates_lbl" x="398" y="104">No Pedestrian</text>
  <text class="signs_markers_plates_lbl" x="398" y="117">Crossing</text>
  <text class="signs_markers_plates_sub" x="398" y="130">Red circle and slash</text>
  <!-- Road entering curve W1-10: curve arrow with a side road joining -->
  <g transform="translate(62,190)">
    <polygon points="0,-34 34,0 0,34 -34,0" fill="#FFCD00" stroke="#1c1c1c" stroke-width="1"/>
    <polygon points="0,-31 31,0 0,31 -31,0" fill="none" stroke="#1c1c1c" stroke-width="2"/>
    <path d="M-2,20 L-2,2 Q-2,-11 10,-14" fill="none" stroke="#1c1c1c" stroke-width="4.5" marker-end="url(#signs_markers_plates_ah)"/>
    <line x1="-17" y1="0" x2="-2" y2="0" stroke="#1c1c1c" stroke-width="4"/>
  </g>
  <text class="signs_markers_plates_lbl" x="62" y="248">Road Entering Curve</text>
  <text class="signs_markers_plates_sub" x="62" y="261">Yellow diamond</text>
  <!-- JCT plate M2-1 over a U.S. route marker -->
  <g transform="translate(172,190)">
    <rect x="-24" y="-41" width="48" height="18" rx="2" fill="#fff" stroke="#1c1c1c" stroke-width="1"/>
    <text x="0" y="-27.5" font-size="12" font-weight="800" fill="#1c1c1c" text-anchor="middle">JCT</text>
    <g transform="translate(0,3)"><rect x="-24" y="-24" width="48" height="48" rx="3" fill="#1c1c1c"/><path d="M-17,-18 Q-12,-21 -8.5,-17 L8.5,-17 Q12,-21 17,-18 Q20.5,-13.5 18,-8.5 Q21.5,-1.5 19.5,5 C18,15.5 5,19 0,22.5 C-5,19 -18,15.5 -19.5,5 Q-21.5,-1.5 -18,-8.5 Q-20.5,-13.5 -17,-18 Z" fill="#fff"/><text x="0" y="8" font-size="18" font-weight="800" fill="#1c1c1c" text-anchor="middle">30</text></g>
  </g>
  <text class="signs_markers_plates_lbl" x="172" y="248">Junction Plate</text>
  <text class="signs_markers_plates_sub" x="172" y="261">White JCT plate</text>
  <text class="signs_markers_plates_sub" x="172" y="273">over a route marker</text>
  <!-- Cardinal direction plate M3-4 (WEST), route marker and arrow plate M6-1 -->
  <g transform="translate(287,190)">
    <rect x="-26" y="-43" width="52" height="16" rx="2" fill="#fff" stroke="#1c1c1c" stroke-width="1"/>
    <text x="0" y="-31" font-size="11" font-weight="800" fill="#1c1c1c" text-anchor="middle">WEST</text>
    <g transform="translate(0,-4)"><rect x="-22" y="-22" width="44" height="44" rx="3" fill="#1c1c1c"/><path d="M-15.5,-16.5 Q-11,-19 -7.8,-15.5 L7.8,-15.5 Q11,-19 15.5,-16.5 Q18.8,-12.4 16.5,-7.8 Q19.7,-1.4 17.9,4.6 C16.5,14.2 4.6,17.4 0,20.6 C-4.6,17.4 -16.5,14.2 -17.9,4.6 Q-19.7,-1.4 -16.5,-7.8 Q-18.8,-12.4 -15.5,-16.5 Z" fill="#fff"/><text x="0" y="7" font-size="16" font-weight="800" fill="#1c1c1c" text-anchor="middle">30</text></g>
    <rect x="-26" y="20" width="52" height="18" rx="2" fill="#fff" stroke="#1c1c1c" stroke-width="1"/>
    <path d="M14,29 L-8,29" stroke="#1c1c1c" stroke-width="3.5"/><polygon points="-16,29 -7,23 -7,35" fill="#1c1c1c"/>
  </g>
  <text class="signs_markers_plates_lbl" x="287" y="248">Direction Plates</text>
  <text class="signs_markers_plates_sub" x="287" y="261">White WEST and</text>
  <text class="signs_markers_plates_sub" x="287" y="273">arrow plates</text>
  <!-- Left exit: exit number tab on the left edge with a yellow LEFT panel (E1-5bP) -->
  <g transform="translate(402,198)">
    <rect x="-48" y="-22" width="96" height="44" rx="4" fill="#006B3F" stroke="#1c1c1c" stroke-width="1"/>
    <rect x="-45" y="-19" width="90" height="38" rx="2" fill="none" stroke="#fff" stroke-width="2"/>
    <rect x="-48" y="-40" width="72" height="18" rx="2" fill="#006B3F" stroke="#1c1c1c" stroke-width="1"/>
    <rect x="-46" y="-38" width="68" height="14" rx="1" fill="none" stroke="#fff" stroke-width="1.2"/>
    <text x="-24" y="-27.3" font-size="9.5" font-weight="800" fill="#fff" text-anchor="middle">EXIT 22</text>
    <rect x="-1" y="-36.5" width="21" height="11" rx="1" fill="#FFCD00"/>
    <text x="9.5" y="-27.8" font-size="7.6" font-weight="800" fill="#1c1c1c" text-anchor="middle">LEFT</text>
    <text x="0" y="-2" font-size="12" font-weight="800" fill="#fff" text-anchor="middle">Pine Hill</text>
    <text x="0" y="13" font-size="10" font-weight="800" fill="#fff" text-anchor="middle">1/2 MILE</text>
  </g>
  <text class="signs_markers_plates_lbl" x="402" y="248">Left Exit</text>
  <text class="signs_markers_plates_sub" x="402" y="261">Green, exit tab on the</text>
  <text class="signs_markers_plates_sub" x="402" y="273">left with yellow LEFT</text>
</svg>
