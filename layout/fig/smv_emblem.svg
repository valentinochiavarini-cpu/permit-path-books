<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 200" font-family="Inter, Arial, sans-serif">
  <!-- Slow moving vehicle emblem (ASABE S276: fluorescent orange triangle, red retroreflective border, point up) on a buggy; school bus warning lights, flashing yellow then flashing red with stop arm (chapter 4.7, NHTSA) -->
  <style>
    .smv_emblem_lbl { font-size: 11px; font-weight: 600; fill: #1c1c1c; text-anchor: middle; }
    .smv_emblem_sub { font-size: 9.5px; font-weight: 500; fill: #555; text-anchor: middle; }
  </style>

  <g>
  <path d="M28,28 Q75,8 122,28 L122,108 L28,108 Z" fill="#555" stroke="#1c1c1c" stroke-width="1.2"/>
  <rect x="19" y="66" width="6" height="64" rx="2" fill="#1c1c1c"/>
  <rect x="125" y="66" width="6" height="64" rx="2" fill="#1c1c1c"/>
  <rect x="26" y="106" width="98" height="5" fill="#1c1c1c"/>
  <polygon points="77.2,43.9 103.8,92.1 101.7,96.0 48.3,96.0 46.2,92.1 72.8,43.9" fill="#C8102E" stroke="#1c1c1c" stroke-width="1"/>
  <polygon points="75,53.5 96.5,90.5 53.5,90.5" fill="#F47920" stroke="#fff" stroke-width="0.8"/>
  </g>
  <text class="smv_emblem_lbl" x="75" y="148">Slow moving vehicle</text>
  <text class="smv_emblem_sub" x="75" y="161">Fluorescent orange triangle,</text>
  <text class="smv_emblem_sub" x="75" y="174">red border: slow down at once</text>
  <rect x="185" y="22" width="80" height="94" rx="6" fill="#FFCD00" stroke="#1c1c1c" stroke-width="1.2"/>
  <rect x="185" y="22" width="80" height="16" rx="6" fill="#1c1c1c"/>
  <rect x="195" y="46" width="60" height="26" rx="2" fill="#555" stroke="#1c1c1c" stroke-width="1"/>
  <text x="225" y="85" font-size="8.5" font-weight="800" fill="#1c1c1c" text-anchor="middle">SCHOOL BUS</text>
  <rect x="185" y="104" width="80" height="6" fill="#1c1c1c"/>
  <rect x="188" y="112" width="14" height="10" rx="2" fill="#1c1c1c"/>
  <rect x="248" y="112" width="14" height="10" rx="2" fill="#1c1c1c"/>
  <circle cx="195" cy="30" r="5" fill="#444"/>
  <circle cx="213" cy="30" r="5" fill="#FFCD00"/><circle cx="213" cy="30" r="5" fill="none" stroke="#fff" stroke-width="1.2"/>
  <circle cx="237" cy="30" r="5" fill="#FFCD00"/><circle cx="237" cy="30" r="5" fill="none" stroke="#fff" stroke-width="1.2"/>
  <circle cx="255" cy="30" r="5" fill="#444"/>
  <line x1="210" y1="19" x2="208" y2="13" stroke="#1c1c1c" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="216" y1="19" x2="218" y2="13" stroke="#1c1c1c" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="234" y1="19" x2="232" y2="13" stroke="#1c1c1c" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="240" y1="19" x2="242" y2="13" stroke="#1c1c1c" stroke-width="1.6" stroke-linecap="round"/>
  <text class="smv_emblem_lbl" x="225" y="148">Flashing yellow lights</text>
  <text class="smv_emblem_sub" x="225" y="161">The bus is about to stop:</text>
  <text class="smv_emblem_sub" x="225" y="174">slow down, get ready to stop</text>
  <rect x="340" y="22" width="80" height="94" rx="6" fill="#FFCD00" stroke="#1c1c1c" stroke-width="1.2"/>
  <rect x="340" y="22" width="80" height="16" rx="6" fill="#1c1c1c"/>
  <rect x="350" y="46" width="60" height="26" rx="2" fill="#555" stroke="#1c1c1c" stroke-width="1"/>
  <text x="380" y="85" font-size="8.5" font-weight="800" fill="#1c1c1c" text-anchor="middle">SCHOOL BUS</text>
  <rect x="340" y="104" width="80" height="6" fill="#1c1c1c"/>
  <rect x="343" y="112" width="14" height="10" rx="2" fill="#1c1c1c"/>
  <rect x="403" y="112" width="14" height="10" rx="2" fill="#1c1c1c"/>
  <circle cx="350" cy="30" r="5" fill="#C8102E"/><circle cx="350" cy="30" r="5" fill="none" stroke="#fff" stroke-width="1.2"/>
  <circle cx="368" cy="30" r="5" fill="#444"/>
  <circle cx="392" cy="30" r="5" fill="#444"/>
  <circle cx="410" cy="30" r="5" fill="#C8102E"/><circle cx="410" cy="30" r="5" fill="none" stroke="#fff" stroke-width="1.2"/>
  <line x1="347" y1="19" x2="345" y2="13" stroke="#1c1c1c" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="353" y1="19" x2="355" y2="13" stroke="#1c1c1c" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="407" y1="19" x2="405" y2="13" stroke="#1c1c1c" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="413" y1="19" x2="415" y2="13" stroke="#1c1c1c" stroke-width="1.6" stroke-linecap="round"/>
  <rect x="336" y="60" width="4" height="4" fill="#1c1c1c"/>
  <polygon points="334.9,67.4 327.4,74.9 316.6,74.9 309.1,67.4 309.1,56.6 316.6,49.1 327.4,49.1 334.9,56.6" fill="#C8102E" stroke="#1c1c1c" stroke-width="1"/>
  <text x="322" y="65" font-size="7.5" font-weight="800" fill="#fff" text-anchor="middle">STOP</text>
  <text class="smv_emblem_lbl" x="375" y="148">Flashing red and stop arm</text>
  <text class="smv_emblem_sub" x="375" y="161">The bus has stopped:</text>
  <text class="smv_emblem_sub" x="375" y="174">you must stop</text>
  <text class="smv_emblem_sub" x="300" y="192">Bus seen from behind. Lit lamps circled in white.</text>
</svg>
