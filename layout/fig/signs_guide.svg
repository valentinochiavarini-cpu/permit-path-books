<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 236" font-family="Inter, Arial, sans-serif">
  <!-- Guide signs: route markers, green exit and mile marker signs, blue service signs, brown recreation signs -->
  <style>
    .signs_guide_lbl { font-size: 11px; font-weight: 600; fill: #1c1c1c; text-anchor: middle; }
    .signs_guide_sub { font-size: 9.5px; font-weight: 500; fill: #555; text-anchor: middle; }
  </style>
  <!-- Interstate shield (M1-1): red top, blue body, white number -->
  <g transform="translate(46,38)"><path d="M-30,-24 Q-15,-31 0,-25 Q15,-31 30,-24 C33,-6 30,14 0,30 C-30,14 -33,-6 -30,-24 Z" fill="#fff" stroke="#1c1c1c" stroke-width="1"/><clipPath id="signs_guide_isclip"><path d="M-26.5,-20.5 Q-13,-26.5 0,-21 Q13,-26.5 26.5,-20.5 C29,-4 26,12.5 0,26 C-26,12.5 -29,-4 -26.5,-20.5 Z"/></clipPath><g clip-path="url(#signs_guide_isclip)"><rect x="-30" y="-30" width="60" height="62" fill="#003F87"/><rect x="-30" y="-30" width="60" height="19" fill="#C8102E"/></g><text x="0" y="-14.5" font-size="8" font-weight="800" fill="#fff" text-anchor="middle" letter-spacing="-0.3">INTERSTATE</text><text x="0" y="13" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">80</text></g>
  <text class="signs_guide_lbl" x="46" y="86">Interstate</text>
  <text class="signs_guide_sub" x="46" y="99">Red and blue shield</text>
  <!-- U.S. route (M1-4): white shield, black number -->
  <g transform="translate(138,38)"><rect x="-28" y="-28" width="56" height="56" rx="3" fill="#1c1c1c"/><path d="M-20,-21 Q-14,-24 -10,-20 L10,-20 Q14,-24 20,-21 Q24,-16 21,-10 Q25,-2 23,6 C21,18 6,22 0,26 C-6,22 -21,18 -23,6 Q-25,-2 -21,-10 Q-24,-16 -20,-21 Z" fill="#fff"/><text x="0" y="9" font-size="21" font-weight="800" fill="#1c1c1c" text-anchor="middle">30</text></g>
  <text class="signs_guide_lbl" x="138" y="86">U.S. Route</text>
  <text class="signs_guide_sub" x="138" y="99">White shield,</text>
  <text class="signs_guide_sub" x="138" y="111">black number</text>
  <!-- State route: generic marker; design varies by state -->
  <g transform="translate(222,38)"><rect x="-27" y="-22" width="54" height="44" rx="4" fill="#fff" stroke="#1c1c1c" stroke-width="1"/><rect x="-24" y="-19" width="48" height="38" rx="3" fill="none" stroke="#1c1c1c" stroke-width="2"/><text x="0" y="9" font-size="21" font-weight="800" fill="#1c1c1c" text-anchor="middle">12</text></g>
  <text class="signs_guide_lbl" x="222" y="86">State Route</text>
  <text class="signs_guide_sub" x="222" y="99">Design varies</text>
  <text class="signs_guide_sub" x="222" y="111">by state</text>
  <!-- Mile marker (D10-1): small green vertical sign -->
  <g transform="translate(298,38)"><rect x="-15.0" y="-27.0" width="30" height="54" rx="3" fill="#006B3F" stroke="#1c1c1c" stroke-width="1"/><rect x="-12.0" y="-24.0" width="24" height="48" rx="1" fill="none" stroke="#fff" stroke-width="2"/><text x="0" y="-11" font-size="8.5" font-weight="800" fill="#fff" text-anchor="middle">MILE</text><text x="0" y="15" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">47</text></g>
  <text class="signs_guide_lbl" x="298" y="86">Mile Marker</text>
  <text class="signs_guide_sub" x="298" y="99">Green, on the</text>
  <text class="signs_guide_sub" x="298" y="111">shoulder</text>
  <!-- Exit direction sign with exit number tab -->
  <g transform="translate(392,42)"><rect x="-48.0" y="-22.0" width="96" height="44" rx="4" fill="#006B3F" stroke="#1c1c1c" stroke-width="1"/><rect x="-45.0" y="-19.0" width="90" height="38" rx="2" fill="none" stroke="#fff" stroke-width="2"/><rect x="4" y="-37" width="44" height="16" rx="2" fill="#006B3F" stroke="#1c1c1c" stroke-width="1"/><rect x="6" y="-35" width="40" height="12" rx="1" fill="none" stroke="#fff" stroke-width="1.2"/><text x="26" y="-25.5" font-size="9.5" font-weight="800" fill="#fff" text-anchor="middle">EXIT 47</text><text x="0" y="-2" font-size="12" font-weight="800" fill="#fff" text-anchor="middle">Oak Valley</text><text x="0" y="13" font-size="10" font-weight="800" fill="#fff" text-anchor="middle">1 MILE</text></g>
  <text class="signs_guide_lbl" x="392" y="86">Exit Sign</text>
  <text class="signs_guide_sub" x="392" y="99">Green, exit number</text>
  <text class="signs_guide_sub" x="392" y="111">on the top tab</text>
  <!-- Blue motorist service signs: hospital, gas, food, lodging -->
  <g transform="translate(44,160)"><rect x="-18.0" y="-18.0" width="36" height="36" rx="3" fill="#003F87" stroke="#1c1c1c" stroke-width="1"/><rect x="-15.0" y="-15.0" width="30" height="30" rx="1" fill="none" stroke="#fff" stroke-width="2"/><text x="0" y="9" font-size="24" font-weight="800" fill="#fff" text-anchor="middle">H</text></g>
  <g transform="translate(92,160)"><rect x="-18.0" y="-18.0" width="36" height="36" rx="3" fill="#003F87" stroke="#1c1c1c" stroke-width="1"/><rect x="-15.0" y="-15.0" width="30" height="30" rx="1" fill="none" stroke="#fff" stroke-width="2"/><rect x="-9" y="-11" width="12" height="22" rx="1.5" fill="#fff"/><rect x="-6.5" y="-8" width="7" height="6" fill="#003F87"/><rect x="-11" y="10" width="16" height="3" fill="#fff"/><path d="M3,-6 L8,-6 L8,6 Q8,9 10,9 Q12,9 12,6 L12,-6 L9,-10" fill="none" stroke="#fff" stroke-width="2"/></g>
  <g transform="translate(140,160)"><rect x="-18.0" y="-18.0" width="36" height="36" rx="3" fill="#003F87" stroke="#1c1c1c" stroke-width="1"/><rect x="-15.0" y="-15.0" width="30" height="30" rx="1" fill="none" stroke="#fff" stroke-width="2"/><path d="M-8,-12 L-8,-3 Q-8,0 -5,0 L-5,12 M-2,-12 L-2,-3 Q-2,0 -5,0 M-5,-12 L-5,-3" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><path d="M6,12 L6,-12 Q11,-8 11,2 L6,2" fill="#fff" stroke="#fff" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/></g>
  <g transform="translate(188,160)"><rect x="-18.0" y="-18.0" width="36" height="36" rx="3" fill="#003F87" stroke="#1c1c1c" stroke-width="1"/><rect x="-15.0" y="-15.0" width="30" height="30" rx="1" fill="none" stroke="#fff" stroke-width="2"/><rect x="-13" y="-9" width="3" height="20" fill="#fff"/><rect x="-10" y="1" width="23" height="5" fill="#fff"/><rect x="10" y="6" width="3" height="5" fill="#fff"/><circle cx="-5" cy="-3" r="3.2" fill="#fff"/><rect x="-1" y="-5" width="13" height="5" rx="1.5" fill="#fff"/></g>
  <text class="signs_guide_lbl" x="116" y="196">Motorist Services</text>
  <text class="signs_guide_sub" x="116" y="209">Blue: hospital, gas, food, lodging</text>
  <!-- Brown recreation signs: camping, picnic area -->
  <g transform="translate(318,160)"><rect x="-18.0" y="-18.0" width="36" height="36" rx="3" fill="#6B4423" stroke="#1c1c1c" stroke-width="1"/><rect x="-15.0" y="-15.0" width="30" height="30" rx="1" fill="none" stroke="#fff" stroke-width="2"/><polygon points="0,-12 13,11 -13,11" fill="#fff"/><polygon points="0,-1 5,11 -5,11" fill="#6B4423"/><path d="M0,-12 L-4,-16 M0,-12 L4,-16" stroke="#fff" stroke-width="1.6"/></g>
  <g transform="translate(366,160)"><rect x="-18.0" y="-18.0" width="36" height="36" rx="3" fill="#6B4423" stroke="#1c1c1c" stroke-width="1"/><rect x="-15.0" y="-15.0" width="30" height="30" rx="1" fill="none" stroke="#fff" stroke-width="2"/><rect x="-13" y="-6" width="26" height="3.5" fill="#fff"/><path d="M-6,-3 L-10,12 M6,-3 L10,12" stroke="#fff" stroke-width="2.6"/><rect x="-15" y="4" width="30" height="3" fill="#fff"/></g>
  <text class="signs_guide_lbl" x="342" y="196">Recreation</text>
  <text class="signs_guide_sub" x="342" y="209">Brown: camping, picnic area</text>
</svg>
