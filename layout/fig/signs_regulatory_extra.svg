<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 256" font-family="Inter, Arial, sans-serif">
  <!-- Extra regulatory signs: parking, turn rules, lane courtesy, the ALL WAY plaque and accessible parking -->
  <style>
    .signs_regulatory_extra_lbl { font-size: 11px; font-weight: 600; fill: #1c1c1c; text-anchor: middle; }
    .signs_regulatory_extra_sub { font-size: 9.5px; font-weight: 500; fill: #555; text-anchor: middle; }
  </style>
  <!-- No Parking (R8-3): black P, red circle and slash, white square -->
  <g transform="translate(77,46)"><rect x="-34" y="-34" width="68" height="68" rx="4" fill="#fff" stroke="#1c1c1c" stroke-width="1"/><rect x="-31" y="-31" width="62" height="62" rx="3" fill="none" stroke="#1c1c1c" stroke-width="2"/><text x="0" y="12" font-size="36" font-weight="800" fill="#1c1c1c" text-anchor="middle">P</text><circle r="26" fill="none" stroke="#C8102E" stroke-width="5"/><line x1="-18.4" y1="-18.4" x2="18.4" y2="18.4" stroke="#C8102E" stroke-width="5"/></g>
  <text class="signs_regulatory_extra_lbl" x="77" y="100">No Parking</text>
  <text class="signs_regulatory_extra_sub" x="77" y="113">Red circle and slash</text>
  <!-- No Right Turn (R3-1) -->
  <g transform="translate(230,46)"><rect x="-34" y="-34" width="68" height="68" rx="4" fill="#fff" stroke="#1c1c1c" stroke-width="1"/><rect x="-31" y="-31" width="62" height="62" rx="3" fill="none" stroke="#1c1c1c" stroke-width="2"/><path d="M-6,22 L-6,0 Q-6,-8 2,-8 L9,-8" fill="none" stroke="#1c1c1c" stroke-width="6"/><polygon points="19.0,-8.0 9.0,-1.8 9.0,-14.2" fill="#1c1c1c"/><circle r="26" fill="none" stroke="#C8102E" stroke-width="5"/><line x1="-18.4" y1="-18.4" x2="18.4" y2="18.4" stroke="#C8102E" stroke-width="5"/></g>
  <text class="signs_regulatory_extra_lbl" x="230" y="100">No Right Turn</text>
  <text class="signs_regulatory_extra_sub" x="230" y="113">Red circle and slash</text>
  <!-- No Turn on Red (R10-11a) -->
  <g transform="translate(383,46)"><rect x="-26.0" y="-35.0" width="52" height="70" rx="4" fill="#fff" stroke="#1c1c1c" stroke-width="1"/><rect x="-23.0" y="-32.0" width="46" height="64" rx="2" fill="none" stroke="#1c1c1c" stroke-width="2"/><text x="0" y="-12" font-size="16" font-weight="800" fill="#1c1c1c" text-anchor="middle">NO</text><text x="0" y="1" font-size="10.5" font-weight="800" fill="#1c1c1c" text-anchor="middle">TURN</text><text x="0" y="13" font-size="10.5" font-weight="800" fill="#1c1c1c" text-anchor="middle">ON</text><text x="0" y="25" font-size="10.5" font-weight="800" fill="#1c1c1c" text-anchor="middle">RED</text></g>
  <text class="signs_regulatory_extra_lbl" x="383" y="100">No Turn on Red</text>
  <text class="signs_regulatory_extra_sub" x="383" y="113">White rectangle</text>
  <!-- Slower Traffic Keep Right (R4-3) -->
  <g transform="translate(77,170)"><rect x="-26.0" y="-35.0" width="52" height="70" rx="4" fill="#fff" stroke="#1c1c1c" stroke-width="1"/><rect x="-23.0" y="-32.0" width="46" height="64" rx="2" fill="none" stroke="#1c1c1c" stroke-width="2"/><text x="0" y="-13" font-size="8.4" font-weight="800" fill="#1c1c1c" text-anchor="middle">SLOWER</text><text x="0" y="-1" font-size="8.4" font-weight="800" fill="#1c1c1c" text-anchor="middle">TRAFFIC</text><text x="0" y="11" font-size="8.4" font-weight="800" fill="#1c1c1c" text-anchor="middle">KEEP</text><text x="0" y="23" font-size="8.4" font-weight="800" fill="#1c1c1c" text-anchor="middle">RIGHT</text></g>
  <text class="signs_regulatory_extra_lbl" x="77" y="224">Slower Traffic Keep Right</text>
  <text class="signs_regulatory_extra_sub" x="77" y="237">White rectangle</text>
  <!-- Stop sign with ALL WAY plaque (R1-3P): white letters and border on red -->
  <g transform="translate(230,170)"><g transform="translate(0,-10)"><polygon points="-10.4,-25 10.4,-25 25,-10.4 25,10.4 10.4,25 -10.4,25 -25,10.4 -25,-10.4" fill="#fff" stroke="#1c1c1c" stroke-width="1"/><polygon points="-9.5,-23.0 9.5,-23.0 23.0,-9.5 23.0,9.5 9.5,23.0 -9.5,23.0 -23.0,9.5 -23.0,-9.5" fill="#C8102E"/><text x="0" y="5" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">STOP</text></g><rect x="-27" y="19" width="54" height="19" rx="2" fill="#C8102E" stroke="#1c1c1c" stroke-width="1"/><rect x="-25" y="21" width="50" height="15" rx="1.5" fill="none" stroke="#fff" stroke-width="1.2"/><text x="0" y="32" font-size="9.5" font-weight="800" fill="#fff" text-anchor="middle">ALL WAY</text></g>
  <text class="signs_regulatory_extra_lbl" x="230" y="224">All Way Stop</text>
  <text class="signs_regulatory_extra_sub" x="230" y="237">Red ALL WAY plaque</text>
  <!-- Accessible parking (R7-8): green legend on white, white symbol on blue -->
  <g transform="translate(383,170)"><rect x="-26.0" y="-35.0" width="52" height="70" rx="4" fill="#fff" stroke="#1c1c1c" stroke-width="1"/><rect x="-23.0" y="-32.0" width="46" height="64" rx="2" fill="none" stroke="#006B3F" stroke-width="2"/><text x="0" y="-20" font-size="7.4" font-weight="800" fill="#006B3F" text-anchor="middle">RESERVED</text><text x="0" y="-10" font-size="7.4" font-weight="800" fill="#006B3F" text-anchor="middle">PARKING</text><rect x="-15" y="-4" width="30" height="31" rx="2" fill="#003F87"/><g transform="translate(0,12) scale(0.72)"><circle cx="-2" cy="-14" r="3.6" fill="#fff"/><path d="M-3,-8 L-3,3 L7,3 L10,12 L13,12" fill="none" stroke="#fff" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round"/><path d="M-3,-3 L5,-3" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/><path d="M-9,-2 A10.5,10.5 0 1 0 8,13" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></g></g>
  <text class="signs_regulatory_extra_lbl" x="383" y="224">Accessible Parking</text>
  <text class="signs_regulatory_extra_sub" x="383" y="237">White symbol on blue,</text>
  <text class="signs_regulatory_extra_sub" x="383" y="249">green letters</text>
</svg>
