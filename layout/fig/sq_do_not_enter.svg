<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" font-family="Inter, Arial, sans-serif">
  <!-- Single sign for a picture question: do not enter (no label; the question names shape and color in words) -->
  <g transform="translate(50,50) scale(1.324) translate(-0,-0)"><rect x="-34" y="-34" width="68" height="68" rx="4" fill="#fff" stroke="#1c1c1c" stroke-width="1"/><circle r="30" fill="#C8102E"/><rect x="-23" y="-5" width="46" height="10" fill="#fff"/><text x="0" y="-11" font-size="7.5" font-weight="800" fill="#fff" text-anchor="middle">DO NOT</text><text x="0" y="18" font-size="7.5" font-weight="800" fill="#fff" text-anchor="middle">ENTER</text></g>
</svg>
